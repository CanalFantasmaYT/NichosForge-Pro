<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NichosForge Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 48 48' width='46' height='46' aria-label='Nichi ninja'> <defs><radialGradient id='lgCl' cx='35%' cy='30%'><stop offset='0' stop-color='%23a9b8ff'/><stop offset='.45' stop-color='%235b74ff'/><stop offset='1' stop-color='%232436c4'/></radialGradient> <radialGradient id='lgOsc' cx='35%' cy='30%'><stop offset='0' stop-color='%23ff9a9c'/><stop offset='.45' stop-color='%23e5484d'/><stop offset='1' stop-color='%237f1015'/></radialGradient> <clipPath id='lgClip'><circle cx='22' cy='26' r='17'/></clipPath></defs> <path d='M36 17 C42 14 46 15 47 10 C47 17 42 19 36 20Z' fill='%23e5484d'/><path d='M36 19 C42 21 45 25 46 30 C42 26 39 24 35 22Z' fill='%23b8262c'/> <circle cx='22' cy='26' r='17' fill='url(%23lgCl)'/> <g clip-path='url(%23lgClip)'><path d='M3 22 Q22 15 41 22 L41 31 Q22 24 3 31Z' fill='%231d2030'/><path d='M3 14 Q22 7 41 14 L41 18 Q22 11 3 18Z' fill='%23e5484d'/></g> <rect x='18' y='10.5' width='8' height='4' rx='1' fill='%23d7dbe3'/> <path d='M13 25.5 Q16 22.5 19.5 25 Q16 26.5 13 25.5Z' fill='%23fff'/><path d='M24.5 25 Q28 22.5 31 25.5 Q28 26.5 24.5 25Z' fill='%23fff'/> <path d='M18 33 Q22 35.5 26 33' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet">
<script src="/vendor/chart.umd.js"></script>
<style>
:root{
  --bg:#ebeae5; --card:#ffffff; --soft:#f4f3ef; --line:#e6e4dd; --ink:#1d1f1c; --muted:#7b7f78; --dim:#a7aaa3;
  --sage:#4f7a63; --sage2:#6f9a82; --sage3:#dce8df; --sage4:#eef4f0; --red:#d9534f; --red2:#fbe3e1; --amber:#c98a0b; --amber2:#fbf0d6;
  --blue:#4b6bfb; --r:22px; --soft2:#e9e8e2; --ink2:#4b4f48; --hover:#fafaf7; --glass:rgba(255,255,255,.55);
  --good:#4f7a63; --good2:#dce8df; --grad1:#5b8a70; --grad2:#3f6a53; --sh:0 1px 2px rgba(20,30,20,.04),0 8px 24px rgba(20,30,20,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .grow{flex:1} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nowrap{white-space:nowrap}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 0 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:46px;height:46px;display:grid;place-items:center;margin-bottom:8px}
.rail{background:var(--card);border-radius:40px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);flex:1;align-items:center;width:64px}
.rail .sp{flex:1}
.nb{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative;transition:background .15s,color .15s}
.nb:hover{background:var(--soft)}
.nb.on{background:var(--ink);color:#fff}
.nb svg{width:20px;height:20px}
.nb .tip{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
.nb:hover .tip{opacity:1}
.me{width:44px;height:44px;border-radius:50%;background:var(--soft2) center/cover;border:3px solid var(--card);box-shadow:var(--sh);cursor:pointer}
.main{padding:22px 28px 60px 6px;max-width:1500px;width:100%;min-width:0}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.hello h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.6px}
.hello p{margin:2px 0 0;color:var(--ink2)}
.search{display:flex;align-items:center;background:var(--card);border-radius:40px;padding:6px 6px 6px 22px;width:min(440px,40vw);box-shadow:var(--sh)}
.search input{border:0;outline:none;background:none;flex:1;padding:8px 0}
.search kbd{font:600 11px var(--font);color:var(--dim);background:var(--soft);border-radius:6px;padding:2px 6px;margin-right:8px}
.circ{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--card);box-shadow:var(--sh);position:relative}
.circ.dark{background:var(--ink);color:#fff;box-shadow:none}
.circ svg{width:18px;height:18px}
.circ .dotb{position:absolute;top:8px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.circ .dotb.live{background:var(--sage);animation:pl 1.3s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(79,122,99,.5)}70%{box-shadow:0 0 0 8px rgba(79,122,99,0)}100%{box-shadow:0 0 0 0 rgba(79,122,99,0)}}

/* ---------- tarjetas ---------- */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr}
.gmain{grid-template-columns:2fr 1fr 1fr}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);position:relative;min-width:0}
.card h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
.card h3{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.card .sub{color:var(--muted);font-size:12.5px}
.card.green{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff}
.card.green .sub,.card.green .lbl{color:rgba(255,255,255,.75)}
.kpi{display:flex;align-items:center;gap:14px;min-height:78px}
.kpi .ic{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.kpi .ic svg{width:20px;height:20px}
.kpi .ic.tan{background:#f1e7d6}
.kpi .lbl{font-size:13px;color:var(--ink2)}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.kpi canvas{max-width:110px;max-height:52px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 8px;margin-left:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--card);animation:pl 1.3s infinite}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.chip.up{background:var(--good2);color:var(--good)} .chip.down{background:var(--red2);color:var(--red)} .chip.warn{background:var(--amber2);color:var(--amber)}
.chip.blue{background:#e6ebff;color:#3550c8} .chip.dark{background:var(--ink);color:#fff}
.float{position:absolute;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 10px 30px rgba(20,30,20,.10);min-width:170px}
.float .lbl{font-size:11.5px;color:var(--muted)} .float .val{font-size:21px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px} .chartbox.lg{height:320px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:40px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink);text-decoration:none;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--soft2)} .btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sage);color:#fff} .btn.pri:hover{background:#456c57}
.btn.dark{background:var(--ink);color:#fff} .btn.dark:hover{background:#000}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--soft);border:1px solid transparent;border-radius:14px;padding:10px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sage2);background:var(--card)}
textarea{resize:vertical;min-height:70px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:40px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:40px;padding:6px 14px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:40px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.tabs .cnt{opacity:.6;font-weight:500;margin-left:4px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}

/* perfil */
.prof{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ava{width:92px;height:92px;border-radius:50%;background:var(--soft2) center/cover;border:3px dashed #d7d5cd;padding:4px;background-clip:content-box;position:relative}
.ava .ok{position:absolute;right:2px;bottom:4px;width:22px;height:22px;border-radius:50%;background:var(--sage);border:3px solid var(--card);display:grid;place-items:center;color:#fff;font-size:11px}
.prof h2{margin-top:12px} .prof .stats{display:flex;gap:26px;margin-top:16px}
.prof .stats b{display:block;font-size:20px} .prof .stats span{font-size:12px;color:var(--muted)}

/* tablas */
.tw{overflow:auto;border-radius:16px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:var(--hover);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
table.t th.s::after{content:" ↓";color:var(--sage)} table.t th.s.asc::after{content:" ↑"}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t tr:hover td{background:var(--hover)}
table.t tr.sel td{background:var(--sage4)}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums} table.t th.num{text-align:right}
.chn{display:flex;align-items:center;gap:10px;min-width:220px;max-width:300px}
.chn i{width:34px;height:34px;border-radius:50%;background:var(--soft2) center/cover;flex:none}
.chn b{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:650;cursor:pointer}
.chn b:hover{color:var(--sage)}
.chn span{font-size:11.5px;color:var(--muted)}
.sc{display:inline-grid;place-items:center;width:38px;height:24px;border-radius:8px;font-weight:700;font-size:12px}
.sc.hi{background:var(--good2);color:var(--good)} .sc.mid{background:var(--amber2);color:var(--amber)} .sc.lo{background:var(--soft);color:var(--muted)}
.rol{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.rol.referente{background:var(--good2);color:var(--good)} .rol.competidor{background:var(--amber2);color:var(--amber)}
.rol.ingles{background:#e6ebff;color:#3550c8} .rol.otro{background:var(--soft);color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--sage);cursor:pointer}

/* filtros */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.filters input,.filters select{padding:8px 11px;border-radius:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.phr .p{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600}
.phr .p em{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:1px 5px}
.phr .p button{border:0;background:var(--card);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;color:var(--muted)}
.bigsearch{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:40px;padding:6px 6px 6px 20px}
.bigsearch input{background:none!important;border:0!important;padding:10px 0;font-size:15px}

/* barra de selección */
.selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:40px;padding:8px 8px 8px 22px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:40}
.selbar .btn{background:rgba(255,255,255,.12);color:#fff} .selbar .btn:hover{background:rgba(255,255,255,.2)} .selbar .btn.pri{background:var(--sage2)}

/* videos */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vc{background:var(--soft);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.vc .th{aspect-ratio:16/9;background:var(--soft2) center/cover;position:relative;display:block}
.vc .th .o{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:3px 8px}
.vc .th .o.hot{background:var(--sage)}
.vc .th .d{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px}
.vc .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vc .tt{font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.vc .mm{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--soft);cursor:pointer;border:0}
.tag small{color:var(--dim);margin-left:4px}
.tag:hover{background:var(--sage3)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,32,28,.35);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:28px 18px;z-index:60;overflow:auto}
.mbox{background:var(--bg);border-radius:28px;width:min(1240px,100%);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox.sm{width:min(640px,100%);background:var(--card)}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-size:15px;box-shadow:var(--sh)}
.banner{height:120px;border-radius:22px;background:linear-gradient(135deg,#7da38c,#3f6a53) center/cover;margin-bottom:-46px}
.chead{display:flex;align-items:flex-end;gap:16px;padding:0 18px}
.chead .ava{width:96px;height:96px;border:4px solid var(--bg);padding:0;background-clip:border-box;flex:none}
.chead h2{font-size:24px;margin:0 0 4px}
.cks .ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.cks .ck:last-child{border:0}
.cks .ck b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.cks .ck b.y{background:var(--sage3);color:var(--sage)} .cks .ck b.n{background:var(--red2);color:var(--red)}
.money .m{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.money .m:last-child{border:0} .money .m b{font-size:15px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.hist .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--sage)}
.hist .t{font-weight:650;cursor:pointer} .hist .t:hover{color:var(--sage)}
.avs{display:flex} .avs i{width:26px;height:26px;border-radius:50%;background:var(--soft2) center/cover;border:2px solid var(--card);margin-left:-8px}
.avs i:first-child{margin-left:0}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);border-radius:9px;transition:width .4s}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--glass);border-radius:22px;padding:12px;min-height:220px}
.kcol h4{margin:4px 6px 12px;font-size:13px;display:flex;justify-content:space-between}
.kc{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);font-size:12.5px}
.kc .n{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.kc .n i{width:28px;height:28px;border-radius:50%;background:var(--soft2) center/cover;flex:none}
.kc .mm{color:var(--muted);margin-top:6px}
.kc select,.kc input,.kc textarea{font-size:12px;padding:6px 9px;margin-top:6px;border-radius:10px}
.kc textarea{min-height:40px}

/* trabajo en curso */
.job{position:fixed;left:110px;bottom:22px;background:var(--card);border-radius:20px;padding:14px 16px;width:330px;box-shadow:0 12px 40px rgba(20,30,20,.18);z-index:45}
.job .t{font-weight:700;display:flex;gap:8px;align-items:center}
.job .p{font-size:12px;color:var(--muted);margin:6px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- mascota ---------- */
.bot{position:fixed;right:28px;bottom:26px;z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.bot>*{pointer-events:auto}
.bubble{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(20,30,20,.15);max-width:280px;font-size:13px;position:relative;animation:pop .3s ease-out}
.bubble b{color:var(--blue)}
.bubble .xx{position:absolute;top:4px;right:8px;border:0;background:none;color:var(--dim);cursor:pointer}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@property --c1{syntax:"<color>";inherits:false;initial-value:#a9b8ff}
@property --c2{syntax:"<color>";inherits:false;initial-value:#5b74ff}
@property --c3{syntax:"<color>";inherits:false;initial-value:#2436c4}
.blob{width:84px;height:84px;border-radius:50%;cursor:grab;position:relative;touch-action:none;user-select:none;
  --c1:#a9b8ff;--c2:#5b74ff;--c3:#2436c4;
  background:radial-gradient(circle at 32% 28%,var(--c1) 0%,var(--c2) 40%,var(--c3) 100%);
  box-shadow:0 14px 36px color-mix(in srgb,var(--c2) 50%,transparent),inset -6px -10px 18px rgba(0,0,0,.25),inset 6px 8px 16px rgba(255,255,255,.35);
  transition:--c1 .7s,--c2 .7s,--c3 .7s,box-shadow .7s,transform .25s;animation:flt 3.2s ease-in-out infinite;display:grid;place-items:center}
.blob::after{content:"";position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c2) 30%,transparent),transparent 65%);z-index:-1;transition:background .7s}
.blob:hover{transform:scale(1.07)} .blob:active{cursor:grabbing}
.blob.dragging{animation:none;cursor:grabbing;transition:--c1 .7s,--c2 .7s,--c3 .7s}
@keyframes flt{0%,100%{translate:0 0}50%{translate:0 -8px}}
.face{display:flex;flex-direction:column;align-items:center;gap:7px;transform:translateY(2px);transition:transform .15s}
.eyes{display:flex;gap:14px}
.eye{width:11px;height:13px;background:#fff;border-radius:50%;animation:blink 4.5s infinite;transition:height .25s,border-radius .25s,width .25s}
.mouth{width:16px;height:7px;border:2.5px solid #fff;border-top:0;border-radius:0 0 12px 12px;transition:all .3s;opacity:.95}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes look{0%,100%{transform:translate(-4px,0)}50%{transform:translate(4px,0)}}
/* estados de ánimo (color + cara) */

/* ================= MODO OSCURO (estilo vidIQ con tonos rojizos) ================= */
html[data-theme=dark]{color-scheme:dark;
  --bg:#0a0b0f; --card:#13151b; --soft:#1b1e26; --soft2:#252933; --line:#232731; --ink:#eceef3; --ink2:#c3c8d2; --muted:#8a90a0; --dim:#5b6170;
  --sage:#e5484d; --sage2:#ff6b6e; --sage3:rgba(229,72,77,.20); --sage4:rgba(229,72,77,.09); --red:#ff5c5c; --red2:rgba(255,92,92,.15);
  --amber:#f5b43b; --amber2:rgba(245,180,59,.14); --hover:#181b22; --glass:rgba(255,255,255,.025);
  --good:#3ecf8e; --good2:rgba(62,207,142,.14); --grad1:#e5484d; --grad2:#8f1419;

html[data-theme=dark] .salud.rentable{background:var(--good2);color:var(--good)} html[data-theme=dark] .salud.prometedor{background:rgba(54,163,179,.16);color:#6fd3e0}

/* ================= animaciones generales ================= */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section:not(.hidden) .card,section:not(.hidden) .vc,section:not(.hidden) .ccard{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
section:not(.hidden) .grid>*:nth-child(2){animation-delay:.05s} section:not(.hidden) .grid>*:nth-child(3){animation-delay:.1s} section:not(.hidden) .grid>*:nth-child(4){animation-delay:.15s}
.kpi,.vc,.ccard{transition:transform .2s,box-shadow .2s} .kpi:hover,.vc:hover,.ccard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.12)}
.thema{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);cursor:pointer;font-size:18px;transition:transform .4s}
.thema:hover{transform:rotate(25deg)}

/* ================= Nichi: accesorios y skins ================= */
.acc{position:absolute;inset:-30px;pointer-events:none;overflow:visible}
.acc svg{width:144px;height:144px;overflow:visible}
.cola{transform-origin:110px 54px;animation:cola 1.6s ease-in-out infinite}
.cola2{transform-origin:110px 58px;animation:cola 1.9s ease-in-out infinite reverse}
@keyframes cola{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.flota{animation:corazon 2.4s ease-in-out infinite}
@keyframes corazon{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.blob{--glow:var(--c2)}
.bot .blob.skin-fantasma{--c1:#ffffff;--c2:#f1f2fb;--c3:#c9cde6;border-radius:50% 50% 44% 44%/58% 58% 42% 42%;animation:fantasma 3s ease-in-out infinite}
.bot .blob.skin-fantasma .eye{background:#2b2d42;height:15px} .bot .blob.skin-fantasma .mouth{border-color:#2b2d42}
.bot .blob.skin-fantasma.m-ok{box-shadow:0 0 34px #3fae73} .bot .blob.skin-fantasma.m-bad{box-shadow:0 0 34px #e5534b}
.bot .blob.skin-fantasma.m-warn{box-shadow:0 0 34px #e9a524} .bot .blob.skin-fantasma.m-think{box-shadow:0 0 34px #8b5cf6}
@keyframes fantasma{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -12px;rotate:3deg}}
.blob.skin-valentin .face::before,.blob.skin-valentin .face::after{content:"";position:absolute;width:10px;height:6px;border-radius:50%;background:#ff8fb1;top:22px;opacity:.8}
.blob.skin-valentin .face::before{left:-12px}.blob.skin-valentin .face::after{right:-12px}
.face{position:relative}
.emote{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:20px;animation:emote 1.6s ease-out forwards;pointer-events:none}
@keyframes emote{0%{opacity:0;transform:translate(-50%,8px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.blob.mira-izq .face{transform:translate(-7px,2px)!important}.blob.mira-der .face{transform:translate(7px,2px)!important}
.blob.ladea{rotate:-12deg}
.blob.parpadea .eye{animation:blink2 .5s 2}
@keyframes blink2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}

/* ================= Investigación (estilo vidIQ) ================= */
.inv-head{display:flex;gap:10px;align-items:center}
.inv-search{flex:1;display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:6px 6px 6px 16px;border:1px solid var(--line)}
.inv-search input{background:none!important;border:0!important;padding:10px 0;font-size:15px}
.itabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.itabs button{border:0;background:none;padding:10px 16px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap}
.itabs button.on{color:var(--ink);border-bottom-color:var(--sage)}
.itabs button .cnt{font-size:11px;background:var(--soft);border-radius:99px;padding:1px 7px;color:var(--muted)}
.fchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600}
.fchip select,.fchip input{border:0!important;background:transparent!important;padding:3px 4px;font-weight:600;width:auto;border-radius:8px}
.ob{position:absolute;left:10px;top:10px;font-weight:800;font-size:12px;border-radius:8px;padding:3px 8px;color:#fff;background:#3b82f6}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vcard{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:up .4s both}
.vcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.18)}
.vcard .th{aspect-ratio:16/9;background:var(--soft2) center/cover;position:relative;display:block;overflow:hidden}
.vcard .th::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.vcard:hover .th::after{opacity:1}

.vcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}

.vcard .ch i{width:22px;height:22px;border-radius:50%;background:var(--soft2) center/cover;flex:none}

.vcard .ac{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.nchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;cursor:pointer;border:1px dashed transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nchip.ia::after{content:"✨";font-size:10px} .nchip.usuario::after{content:"✓";font-size:10px}
.nchip.sin{background:var(--soft);color:var(--muted)}
.carr{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,280px);gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.carr>*{scroll-snap-align:start}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tgrid a{position:relative;aspect-ratio:16/9;border-radius:14px;background:var(--soft2) center/cover;overflow:hidden;display:block;transition:transform .2s}
.tgrid a:hover{transform:scale(1.03)} .tgrid a span{position:absolute;inset:auto 0 0 0;padding:20px 10px 8px;color:#fff;font-size:12px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .2s}

.nbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nbar:hover b{color:var(--sage)} .nbar .bar2{flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden} .nbar .bar2 i{display:block;height:100%;border-radius:9px}
.pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:280px;animation:pop .2s ease-out}
.kw{display:grid;grid-template-columns:1fr 120px 90px;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.kw .up{color:var(--good);font-weight:700}
.sug{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:10px;cursor:pointer;transition:transform .15s,background .2s;animation:up .4s both}
.sug:hover{transform:translateX(4px);background:var(--sage4)}
.sug .ic{font-size:22px;flex:none}
.mis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mis .ccard.on{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage3)}
.shimmer{background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}

/* ================= TIPOGRAFÍA ================= */
:root{--font:"Inter","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-titulo:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{font-family:var(--font);font-size:14px;line-height:1.5;letter-spacing:-.006em;
  font-feature-settings:"cv11","ss01","ss03";text-rendering:optimizeLegibility;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,.hello h1,.card h2,.chead h2,.dw-t,.kpi .val,.val,.prof h2,.ccard .top b,.vcard .tt,.ob,.sc,.btn,.tabs button,.itabs button{font-family:var(--font-titulo)}
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.035em}
.card h2{font-size:17px;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
.card h3{font-family:var(--font);font-size:11px;letter-spacing:.08em;font-weight:700}
.kpi .val,.val{font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .lbl{font-weight:500}
.sub,.hint,p,.small,.sug div,.vd div{text-wrap:pretty}
.hint{line-height:1.5}
table.t td,.num,.stats b,.mm,.chip,.money .m b,.kw,.nbar{font-variant-numeric:tabular-nums}
table.t th{font-family:var(--font);letter-spacing:.07em}
.btn{font-weight:650;letter-spacing:-.01em}
.vcard .tt{font-size:14px;font-weight:700;letter-spacing:-.015em;line-height:1.32}
.chip,.rol,.auto,.aud,.salud,.nchip{letter-spacing:0}
input,select,textarea,button{font-family:inherit;letter-spacing:inherit}
::placeholder{color:var(--dim);opacity:1}
::selection{background:var(--sage3)}
/* chat de Nichi: texto con formato */
.chat .m{white-space:normal;font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.chat .m.u{white-space:pre-wrap}
.chat .m p{margin:0 0 .55em}.chat .m p:last-child{margin-bottom:0}
.chat .m h4{font-family:var(--font-titulo);font-size:14.5px;font-weight:750;margin:.7em 0 .35em;letter-spacing:-.015em}
.chat .m h4:first-child{margin-top:0}
.chat .m ul,.chat .m ol{margin:.25em 0 .6em;padding-left:1.25em}
.chat .m li{margin:.22em 0}.chat .m li::marker{color:var(--sage);font-weight:700}
.chat .m b{font-weight:700;color:var(--ink)}
.chat .m blockquote{margin:.5em 0;padding:.4em .8em;border-left:3px solid var(--sage);background:var(--sage4);border-radius:0 10px 10px 0}
.chat .m hr{border:0;border-top:1px solid var(--line);margin:.7em 0}
.chat .m code{font-family:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;font-size:12px;background:var(--soft2);padding:1px 5px;border-radius:5px}
.chat .m .acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chat .m .acciones .btn{padding:6px 11px;font-size:12px}
.chat .m details{margin-top:8px;font-size:12.5px;color:var(--muted)}
.chat .m details summary{cursor:pointer;font-weight:600}
.pensando{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.pensando i{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pz 1s infinite}
.pensando i:nth-child(2){animation-delay:.15s}.pensando i:nth-child(3){animation-delay:.3s}
@keyframes pz{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.modos{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.modos button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap}
.modos button:hover{border-color:var(--sage);color:var(--sage)}

/* chat más amplio: modos y sugerencias en una sola fila desplazable */
.chat{width:min(410px,calc(100vw - 40px));height:min(600px,calc(100vh - 150px))}
.chat .sugs{flex-wrap:nowrap;overflow-x:auto;padding:6px 14px 0;scrollbar-width:none}
.chat .sugs::-webkit-scrollbar,.modos::-webkit-scrollbar{display:none}
.chat .sugs button{white-space:nowrap;flex:none}
.chat .msgs{padding:14px 14px 10px}
.chat .m.b{max-width:92%}
</style>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => n==null||isNaN(n) ? "—" : Math.abs(n)>=1e9 ? (n/1e9).toFixed(1)+"B" : Math.abs(n)>=1e6 ? (n/1e6).toFixed(1)+"M" : Math.abs(n)>=1e4 ? Math.round(n/1e3)+"K" : Math.abs(n)>=1e3 ? (n/1e3).toFixed(1)+"K" : String(Math.round(n));
const fmtF = n => n==null ? "—" : Number(n).toLocaleString("es-CO");
const usd = (n, dec) => n==null ? "—" : "$" + (Math.abs(n)>=1e4 ? fmtN(n) : Number(n).toLocaleString("en-US",{minimumFractionDigits:dec??0, maximumFractionDigits:dec??0}));
const edadTxt = d => d==null ? "—" : d<31 ? `${d} d` : d<365 ? `${Math.round(d/30)} meses` : `${(d/365).toFixed(1)} años`;
const fmtDur = s => { s=s||0; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };
const fecha = x => x ? new Date(x).toLocaleString("es",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const ROL = {referente:"✔ Referente", ingles:"Inglés", competidor:"Competidor ES", otro:"Otro idioma"};
const TIPO = {evergreen:"🌲 Evergreen", trendy:"🔥 Trendy", mixto:"🔀 Mixto", sin_datos:"Sin datos"};
const AUTO = {automatizado:"🤖 Automatizado", posible:"❓ Posible", marca:"🙂 Marca personal"};
const AUD = {mayores:"👴 Mayores", jovenes:"🧑 Jóvenes", general:"👥 General"};
const SALUD = {rentable:"💚 Rentable", prometedor:"💠 Prometedor", dudoso:"🟡 Dudoso", peligroso:"⛔ Peligroso"};
const MOOD_SALUD = {rentable:"m-ok", prometedor:"m-pro", dudoso:"m-warn", peligroso:"m-bad"};
function accion(t){ S.acciones.push({t, h:new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}); S.acciones = S.acciones.slice(-25); }
const ETAPA = {lista:"📥 Lista", filtro1:"🔎 Filtro 1", filtro2:"🔬 Filtro 2", filtro3:"🎯 Filtro 3", elegido:"✅ Elegido", descartado:"❌ Descartado"};
let VERDE = "#4f7a63", VERDE2 = "#8fb39c", VERDE3 = "#c9dccf", GRIS = "#d9d7d0", AZUL = "#4b6bfb", AMBAR = "#c98a0b", GRID = "#efeee9", TINTA = "#3f4a3f";
const S = {_cargado: Date.now()/1000 - 1, _manejado: null, E:null, page:"inicio", busq:null, sel:new Set(), sort:{k:"score", asc:false}, vsort:"outlier", frases:[], lang:"en",
           f:{texto:"", rol:"todos", idioma:"todos", subs_min:"", subs_max:"", vmes_min:"", edad_max:"", cat:"todas", shorts:true, riesgo:false, auto:"todos"},
           acciones:[], ACAD:null,
           tab:"canales", charts:{}, ultimoTrabajo:null, metrica:"v"};

async function api(path, body){
  const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 90000);
  let r;
  try{ r = await fetch(path, {...(body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {}), signal:ctl.signal}); }
  catch(e){ throw new Error(e.name==="AbortError" ? "El panel tardó demasiado en responder. Revisa la ventana negra de NichosForge." : "No hay conexión con el panel (¿cerraste la ventana negra?)."); }
  finally{ clearTimeout(tm); }
  const d = await r.json();
  if (!r.ok || d.error) throw new Error(d.error || r.statusText);
  return d;
}
function toast(msg, ms=2600){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function err(e){ toast("⚠ "+(e.message||e), 4200); accion("Error: "+(e.message||e)); if(typeof NI!=="undefined"){ NI.mood("m-bad", 4000, "Algo falló"); } nichiDice("Ups: "+esc(e.message||e)); }

/* ================= gráficos ================= */
if (window.Chart){
  Chart.defaults.font.family = "Inter, system-ui, sans-serif"; Chart.defaults.font.size = 11.5; Chart.defaults.color = "#7b7f78";
  Chart.defaults.plugins.legend.labels.boxWidth = 10; Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.tooltip.backgroundColor = "#1d1f1c"; Chart.defaults.plugins.tooltip.padding = 10; Chart.defaults.plugins.tooltip.cornerRadius = 10;
}
function chart(id, cfg){
  if (S.charts[id]) { S.charts[id].destroy(); delete S.charts[id]; }
  const el = document.getElementById(id); if (!el || !window.Chart) return null;
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, animation:{duration:500}}, cfg.options||{});
  return S.charts[id] = new Chart(el, cfg);
}

function ir(p){
  S.page = p;
  document.querySelectorAll("#rail .nb").forEach(b=>b.classList.toggle("on", b.dataset.p===p));
  document.querySelectorAll("section[id^=p-]").forEach(s=>s.classList.toggle("hidden", s.id!=="p-"+p));
  const fn = ({inicio:renderInicio, micanal:renderMiCanal, explorar:renderExplorar, virales:renderVirales, graficos:renderGraficos,
    guardados:renderGuardados, historial:renderHistorial, ajustes:renderAjustes, descubrir:renderDescubrir, academia:renderAcademia, investigacion:renderInvestigacion, seguimiento:renderSeguimiento, miniaturas:renderMiniaturas, oportunidad:renderOportunidad, mapa:renderMapa})[p];
  Promise.resolve().then(()=>fn()).catch(e=>{
    console.error(e);
    $("#p-"+p).innerHTML = `<div class="card empty"><div class="big">😵</div><b>No pude mostrar esta sección.</b><br><span class="hint">${esc(e.message||e)}</span><br>

async function cargarEstado(){
  try{ S.E = await api("/api/estado"); }catch(e){ return; }
  const E = S.E;
  S.VG = new Set(E.ids_videos||[]); S.CG = new Set(E.ids_canales||[]);
  $("#hola").textContent = `Hola${E.nombre?", "+E.nombre:""} 👋`;
  $("#holaSub").textContent = E.mi_canal ? `Explora tu canal ${E.mi_canal.canal} y los nichos que estás investigando` : "Encuentra nichos y referentes con datos reales de YouTube";
  $("#meAva").style.backgroundImage = E.mi_canal ? `url('${E.mi_canal.avatar}')` : "";
  pintarTrabajo(E.trabajo);
}
function pintarTrabajo(t){
  const corriendo = t && t.estado==="trabajando";
  $("#jobDot").classList.toggle("hidden", !corriendo); $("#jobDot").className = "dotb live" + (corriendo?"":" hidden"); $("#jobDot").textContent = "";
  const box = $("#job");
  if (corriendo || (t && ["error","detenido"].includes(t.estado) && S.verJob)){
    box.classList.remove("hidden");
    box.innerHTML = `<div class="t">${corriendo?'<span class="chip up" style="padding:2px 7px">●</span>':t.estado==="error"?"⚠":"■"} ${esc(t.titulo||"Trabajo")}<div class="grow"></div>
      ${corriendo?`<button class="btn sm danger" onclick="api('/api/cancelar',{}).then(()=>toast('Deteniendo…'))">Detener</button>`:`<button class="x" style="width:28px;height:28px;box-shadow:none;background:var(--soft)" onclick="S.verJob=false;$('#job').classList.add('hidden')">✕</button>`}</div>
      <div class="p" title="${esc(t.paso)}">${esc(t.paso||"")}</div><div class="prog"><i style="width:${t.pct||0}%"></i></div>`;
    NI.pensando(corriendo);
  } else { box.classList.add("hidden"); NI.pensando(false); }
  // resultados parciales: la investigación se muestra apenas está lista (la IA sigue nombrando nichos)
  if (t && t.parcial && t.parcial.id && S._parcial !== t.parcial.id){
    S._parcial = t.parcial.id;
    if (t.parcial.tipo === "busqueda"){ abrirBusqueda(t.parcial.id, true); nichiDice("✨ ¡Resultados listos! Mientras los revisas, verifico rostros y miniaturas…", 7000); }
    else { S.inv = null; S.invTab = "parati"; ir("investigacion"); nichiDice("✨ ¡Ya tienes resultados! Mientras los revisas, sigo nombrando nichos y verificando rostros…", 8000); }
  }
  // al terminar
  // un trabajo lanzado en esta sesión terminó (aunque haya sido tan rápido que nunca lo vimos "trabajando")
  if (t && t.inicio && t.inicio > S._cargado && !["trabajando","inactivo"].includes(t.estado) && S._manejado !== t.inicio){
    S._manejado = t.inicio;
    if (t.estado==="listo" && t.resultado){
      NI.feliz(); accion("Terminó: "+(t.titulo||"trabajo"));
      if (t.resultado.tipo==="busqueda"){ if (S._parcial===t.resultado.id){ if (S.page==="explorar") abrirBusqueda(t.resultado.id); } else abrirBusqueda(t.resultado.id, true); nichiDice(`¡Listo! ${esc(t.paso)}`); }
      else if (t.resultado.tipo==="investigacion"){ S.inv=null; if (S.page==="investigacion" || S._parcial!==t.resultado.id){ ir("investigacion"); } nichiDice(`🔎 ${esc(t.paso)}`);
        if (typeof cargarSugerencias==="function") setTimeout(()=>cargarSugerencias(true), 1500); }
      else if (t.resultado.tipo==="mapa"){ S.mapaId = t.resultado.id; ir("mapa"); nichiDice("🎯 ¡Tu mapa está listo! Mira tus referentes y tu competencia."); }
      else if (t.resultado.tipo==="referentes"){ S.virTab = "referentes"; if (S.page==="virales") renderVirales(); nichiDice("🚀 Referentes actualizados."); }
      else if (t.resultado.tipo==="miniaturas"){ nichiDice("📡 ¡Radar actualizado! Mira qué miniaturas están funcionando ahora."); if (S.page==="miniaturas") renderMiniaturas(); else api("/api/miniaturas/patrones?dias=30").then(d=>{ S.MIN=d; }); }
      else { nichiDice("¡Ya analicé tu canal! Mira tus números en <b>Mis canales</b>."); if (S.page==="micanal"||S.page==="inicio") ir(S.page); }
      if (typeof cargarSugerencias==="function") setTimeout(()=>cargarSugerencias(true), 800);
    } else if (t.estado==="error"){ S.verJob=true; NI.mood("m-bad", 5000, "Error"); nichiDice("No pude terminar: "+esc(t.paso)); }
  }
  S.ultimoTrabajo = t;
}
async function sondeo(){
  if (document.visibilityState!=="visible") return;
  try{ const t = await api("/api/trabajo"); pintarTrabajo(t); if (t.estado==="trabajando" || (S.E && S.E.trabajo.estado==="trabajando")) cargarEstado(); }catch(e){}
}
$("#btnJob").onclick = ()=>{ S.verJob = true; const t=S.ultimoTrabajo; if(!t||t.estado==="inactivo") return toast("No hay trabajos en curso"); pintarTrabajo(t); $("#job").classList.remove("hidden"); };

<script>

const PAISES = [["auto","Automático"],["todos","Todo el mundo"],["US","Estados Unidos"],["GB","Reino Unido"],["CA","Canadá"],["AU","Australia"],["MX","México"],["ES","España"],["CO","Colombia"],["AR","Argentina"],["CL","Chile"],["PE","Perú"],["EC","Ecuador"],["VE","Venezuela"]];
function costoBusqueda(){ const n=S.frases.length||1, pg=+($("#exPag")||{}).value||1, mc=+($("#exMax")||{}).value||30; return n*pg*100 + mc*2 + 4; }
function renderFrases(){
  $("#exFrases").innerHTML = S.frases.map((f,i)=>`<span class="p"><em>${(f.idioma||"todos").toUpperCase()}</em>${esc(f.texto)}<button title="Quitar" onclick="S.frases.splice(${i},1);renderFrases()">✕</button></span>`).join("");
  $("#exCosto").textContent = `≈ ${fmtF(costoBusqueda())} unidades de cuota`;
}
function agregarFrase(){
  const t = $("#exQ").value.trim(); if (!t) return false;
  t.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{
    const langs = S.lang==="ambos" ? ["en","es"] : [S.lang];
    langs.forEach(l=>{ if(!S.frases.some(f=>f.texto===x&&f.idioma===l)) S.frases.push({idioma:l, texto:x}); });
  });
  $("#exQ").value=""; renderFrases(); return true;
}
async function lanzarBusqueda(){
  agregarFrase();
  if (!S.frases.length) return toast("Escribe una frase de búsqueda");
  const p = {frases:S.frases, dias:+$("#exDias").value, region:$("#exPais").value, duracion:$("#exDur").value,
             paginas:+$("#exPag").value, max_canales:+$("#exMax").value, orden:$("#exOrden").value};
  try{ await api("/api/buscar", p); accion("Buscar: "+S.frases.map(f=>f.texto).join(", ")); S.verJob=true; toast("Buscando…"); nichiDice("Estoy buscando canales y videos virales. Te aviso cuando termine 🔎"); sondeo(); }catch(e){ err(e); }
}

  const el = $("#p-explorar");

      </div>

    </div>
    <div id="exRes" style="margin-top:18px"></div>`;

async function analizarLinks(){
  try{ await api("/api/analizar_links",{links:$("#exLinksTxt").value}); S.verJob=true; $("#exLinksTxt").value=""; toast("Analizando canales…"); sondeo(); }catch(e){ err(e); }
}
async function abrirBusqueda(id, irAhi){
  try{ const nueva = await api("/api/busqueda?id="+id); if(!S.busq || S.busq.id!==nueva.id) S.f.auto = nueva.filtro_auto ? "posible" : "todos"; S.busq = nueva; S.sel.clear(); }catch(e){ return err(e); }
  if (irAhi || S.page!=="explorar"){ ir("explorar"); } else renderResultados();
  cargarEstado();
}
function filtrados(){
  if (!S.busq) return [];
  const f = S.f, t = f.texto.toLowerCase();
  const out = S.busq.canales.filter(c =>
    (f.rol==="todos" || c.rol===f.rol) && (f.idioma==="todos" || c.idioma===f.idioma) &&
    (!f.subs_min || (c.suscriptores||0) >= +f.subs_min) && (!f.subs_max || (c.suscriptores||0) <= +f.subs_max) &&
    (!f.vmes_min || c.visitas_mes >= +f.vmes_min) && (!f.edad_max || c.edad_dias <= +f.edad_max) &&
    (f.cat==="todas" || c.categoria===f.cat) && (!f.shorts || c.pct_shorts < 70) && (!f.riesgo || !(c.riesgos||[]).length) &&
    (f.auto==="todos" || (f.auto==="posible" ? c.auto_tipo!=="marca" : c.auto_tipo===f.auto)) &&
    (!t || (c.canal+" "+c.handle+" "+(c.tags_top||[]).join(" ")).toLowerCase().includes(t)));
  const k = S.sort.k, s = S.sort.asc ? 1 : -1;
  return out.sort((a,b)=> typeof a[k]==="string" ? s*String(a[k]).localeCompare(b[k]) : s*((a[k]??-1)-(b[k]??-1)));
}

function md(t){
  /* Markdown sencillo -> HTML seguro: títulos, **negrita**, *cursiva*, `código`, listas y enlaces */
  let h = esc(t||"").replace(/\r/g,"");
  h = h.replace(/^#{1,4}\s*(.+)$/gm, "<b style=\"font-size:14px\">$1</b>");
  h = h.replace(/^\s*[-*•]\s+/gm, "• ");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(«"])\*([^*\n]+?)\*(?=[\s.,;:!?)»"]|$)/g, "$1<i>$2</i>").replace(/(^|\s)_([^_\n]+?)_(?=[\s.,;:!?)]|$)/g, "$1<i>$2</i>");
  h = h.replace(/`([^`\n]+)`/g, "<code style=\"background:var(--soft2);padding:1px 5px;border-radius:5px\">$1</code>");
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, "<a href=\"$2\" target=\"_blank\">$1</a>");
  h = h.replace(/\n{3,}/g, "\n\n");
  return h;
}

function aplicarSkin(){

function tamChat(w, h){ const c=$("#chat"); c.style.width=w+"px"; c.style.height=h+"px"; }
function colocarGrip(){
  const bot=$("#bot"), g=$("#grip"), izq=bot.classList.contains("izq"), arriba=bot.classList.contains("arriba");
  g.style.top = arriba ? "auto" : "2px"; g.style.bottom = arriba ? "2px" : "auto";
  g.style.left = izq ? "auto" : "2px"; g.style.right = izq ? "2px" : "auto";
  g.style.transform = (izq===arriba) ? "none" : "scaleX(-1)";
  g.style.cursor = (izq===arriba) ? "nwse-resize" : "nesw-resize";
}

  g.addEventListener("pointermove", e=>{ if(!ini) return; const bot=$("#bot"), izq=bot.classList.contains("izq"), arriba=bot.classList.contains("arriba");
    const w = ini.w + (izq ? 1 : -1)*(e.clientX-ini.x), h = ini.h + (arriba ? 1 : -1)*(e.clientY-ini.y);

const fmtHace = d => d<1 ? "hoy" : d<31 ? `hace ${d} d` : d<365 ? `hace ${Math.round(d/30)} meses` : `hace ${(d/365).toFixed(1)} años`;
function claseOutlier(o){ return o>=50 ? "o50" : o>=10 ? "o10" : o>=3 ? "o3" : ""; }
function textoOutlier(o){ return o==null ? "" : o>=100 ? ">100x" : o+"x"; }
function colorNicho(n){ if(!n || n==="Sin clasificar") return null; let h=0; for (const ch of n) h=(h*31+ch.charCodeAt(0))%360; return h; }
function chipNicho(n, fuente, tipo, id){
  const h = colorNicho(n), osc = document.documentElement.dataset.theme==="dark";
  const st = h==null ? "" : `background:hsla(${h},70%,${osc?55:45}%,.16);color:hsl(${h},${osc?70:55}%,${osc?72:32}%)`;
  const origen = {ia:"La IA lo clasificó", usuario:"Lo corregiste tú", canal:"Heredado del nicho de su canal", reglas:"Por las palabras del título", modelo:"Por lo que aprendió de tus datos"}[fuente] || "";
  return `<span class="nchip ${h==null?"sin":""} ${fuente==="ia"?"ia":fuente==="usuario"?"usuario":""}" style="${st}" title="${origen?origen+" · ":""}Toca para cambiar el nicho (NichosForge lo aprende)" onclick="event.stopPropagation();editarNicho(event,'${tipo}','${id}')">🏷 ${esc(n||"Sin clasificar")}</span>`;
}
async function cargarInv(id){

function invVideos(){
  if (!S.inv) return [];
  const f = S.invF, txt = (S.invTxt||"").toLowerCase();
  let vs = S.inv.videos.filter(v => (f.nicho==="todos" || v.nicho===f.nicho) && (v.outlier||0) >= +f.omin && (!f.vmin || v.vistas >= +f.vmin)
    && (!f.smax || (v.suscriptores||0) <= +f.smax) && (!f.dias || v.dias <= +f.dias) && (f.auto==="todos" || v.auto_tipo===f.auto)
    && (!txt || (v.titulo+" "+v.canal+" "+v.nicho).toLowerCase().includes(txt)));
  const k = f.orden;
  return vs.sort((a,b)=> k==="dias" ? a.dias-b.dias : k==="score" ? ((b.outlier||0)*.6+Math.min(50,b.vph/100)*.4)-((a.outlier||0)*.6+Math.min(50,a.vph/100)*.4) : (b[k]||0)-(a[k]||0));
}
function invCanales(){
  if (!S.inv) return [];
  const f = S.invF, txt = (S.invTxt||"").toLowerCase();
  return S.inv.canales.filter(c => (f.nicho==="todos" || c.nicho===f.nicho) && (!f.smax || (c.suscriptores||0) <= +f.smax) && (f.auto==="todos" || c.auto_tipo===f.auto)

}

      p.remove(); toast("¡Aprendido! 🧠"); emote("🧠"); accion(`Asignó el nicho «${n}»`);

  pintarSugerencias();

    const s0 = S.SUG.sugerencias[0]; nichiDice(`💡 <b>${esc(s0.titulo)}</b><br>${esc(s0.detalle)}`, 10000); emote("💡");
  }
}
function accionSug(i){
  const a = (S.SUG.sugerencias[i]||{}).accion || {}; accion("Siguió la sugerencia: "+S.SUG.sugerencias[i].titulo);
  if (a.tipo==="buscar"){ ir("explorar"); setTimeout(()=>{ $("#exQ").value=a.valor; agregarFrase(); }, 150); }
  else if (a.tipo==="investigacion"){ S.invTab = a.valor==="canales"?"canales":"videos"; ir("investigacion"); }
  else if (a.tipo==="ir") ir(a.valor==="micanal"?"micanal":a.valor);
}
function pintarSugerencias(){
  const box = $("#sugBox"); if (!box || !S.SUG) return;
  box.innerHTML = S.SUG.sugerencias.map((s,i)=>`<div class="sug" style="animation-delay:${i*70}ms" onclick="accionSug(${i})"><span class="ic">${esc(s.icono||"💡")}</span>
    <div><b>${esc(s.titulo)}</b><div class="small muted" style="margin-top:2px">${esc(s.detalle)}</div></div></div>`).join("")
    + `<div class="hint">${S.SUG.fuente==="reglas"?"Sugerencias automáticas · con una clave de IA analizo tus datos a fondo":"Analizado por "+esc(S.SUG.fuente)} · ${fecha(S.SUG.fecha)}</div>`;
}
setInterval(()=>{ if (document.visibilityState==="visible") cargarSugerencias(false); }, 600000);

/* ---------------- INICIO: sugerencias, investigación y cambio de canal ---------------- */
const _renderInicio = renderInicio;
renderInicio = function(){
  _renderInicio();
  const E = S.E||{}, el = $("#p-inicio");
  const mis = E.mis_canales||[], inv = (E.investigaciones||[])[0];
  if (mis.length > 1){
    const prof = el.querySelector(".gmain .prof");
    if (prof) prof.insertAdjacentHTML("beforeend", `<div class="row" style="justify-content:center;margin-top:10px;gap:6px">${mis.map(c=>`<i title="${esc(c.canal)}" onclick="activarMio('${c.id}').then(()=>ir('inicio'))" style="width:30px;height:30px;border-radius:50%;cursor:pointer;background:var(--soft2) url('${esc(c.avatar)}') center/cover;outline:${c.activo?"3px solid var(--sage)":"none"};outline-offset:2px"></i>`).join("")}</div>`);
  }
  el.insertAdjacentHTML("beforeend", `<div class="grid g2" style="margin-top:18px">
    <div class="card"><div class="row"><h2 class="grow">💡 Nichi sugiere</h2><button class="btn sm" onclick="cargarSugerencias(true);this.textContent='Pensando…'">↻ Analizar ahora</button></div><div id="sugBox" style="margin-top:12px"><div class="shimmer" style="height:120px"></div></div></div>
    <div class="card"><div class="row"><h2 class="grow">🔭 Investigación reciente</h2><button class="btn sm pri" onclick="ir('investigacion')">${inv?"Abrir":"Empezar"}</button></div>
      ${inv ? `<div class="sub" style="margin:6px 0 10px">${esc(inv.titulo)} · ${fecha(inv.fecha)} · ${inv.videos} videos · ${inv.canales} canales</div>
        <div class="chartbox sm"><canvas id="iniNichos"></canvas></div>` : `<div class="empty" style="padding:30px"><div class="big">🔭</div>Reviso cientos de videos, detecto canales sin rostro y les pongo nicho.</div>`}</div></div>`);
  if (inv){ const top = inv.nichos.filter(([n])=>n!=="Sin clasificar").slice(0,7);
    chart("iniNichos", {type:"bar", data:{labels:top.map(x=>x[0].length>22?x[0].slice(0,21)+"…":x[0]), datasets:[{data:top.map(x=>x[1]), backgroundColor:top.map(x=>`hsl(${colorNicho(x[0])},60%,52%)`)}]},
      options:{indexAxis:"y", plugins:{legend:{display:false}}, scales:{x:{grid:{color:GRID}, ticks:{precision:0}}, y:{grid:{display:false}}},
        onClick:(e,els)=>{ if(els[0]){ S.invF.nicho=top[els[0].index][0]; S.invTab="videos"; ir("investigacion"); } }}}); }
  if (S.SUG) pintarSugerencias(); else cargarSugerencias(false);
};

/* ---------------- AJUSTES: apariencia y varias claves de YouTube ---------------- */
const _renderAjustes = renderAjustes;
renderAjustes = async function(){
  await _renderAjustes();
  let ky = {claves:[]}; try{ ky = await api("/api/claves_youtube"); }catch(e){}
  const E = S.E||{}, el = $("#p-ajustes");
  el.insertAdjacentHTML("afterbegin", `<div class="grid g2" style="margin-bottom:18px">
    <div class="card"><h2>🎨 Apariencia y Nichi</h2>
      <label class="l">Tema</label><div class="seg" id="ajTema"><button data-t="claro" class="${document.documentElement.dataset.theme!=="dark"?"on":""}">☀️ Claro</button><button data-t="oscuro" class="${document.documentElement.dataset.theme==="dark"?"on":""}">🌙 Oscuro (rojizo)</button></div>
      <label class="l">Disfraz de Nichi</label><select id="ajSkin"><option value="auto">📅 Automático según el calendario de EE. UU. (hoy: ${SKINS[skinDelMes()]})</option>${Object.entries(SKINS).map(([k,n])=>`<option value="${k}" ${E.nichi_skin===k?"selected":""}>${n}</option>`).join("")}</select>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="ajDatos" ${!NI.silencio?"checked":""}> Nichi suelta datos y consejos sola</label></div>
    <div class="card"><div class="row"><h2 class="grow">🔑 Claves de YouTube</h2><span class="chip">${ky.claves.length} clave(s) · ${fmtF(ky.cuota_hoy||0)} u. hoy</span></div>
      <div class="sub">Agrega varias: cuando una se queda sin cuota (10.000 u./día cada una), sigo con la siguiente sin detenerme.</div>
      <div id="kyList" style="margin-top:10px">${ky.claves.map(k=>`<div class="hist" style="padding:8px 0"><div class="bar" style="background:${k.agotada?"var(--red)":VERDE}"></div>
        <b style="width:26px">#${k.n}</b><code style="flex:1">${esc(k.vista)}</code><span class="chip ${k.agotada?"down":"up"}">${k.agotada?esc(k.agotada):"activa"}</span>
        <span class="hint" style="width:120px;text-align:right">${fmtF(k.usadas)} / 10.000 u.</span><button class="btn sm danger" onclick="quitarClaveYT(${k.n-1})">✕</button></div>`).join("") || `<div class="hint">Aún no hay claves.</div>`}</div>
      <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="password" id="kyNueva" placeholder="Pega otra clave de YouTube Data API v3"><button class="btn pri" id="kyAdd">Agregar</button></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="kyProbar">Probar todas</button><a class="btn sm ghost" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">Sacar otra clave ↗</a><span id="kyRes" class="small"></span></div></div></div>`);
  document.querySelectorAll("#ajTema button").forEach(b=>b.onclick=async ()=>{ aplicarTema(b.dataset.t, true); try{ await api("/api/ajustes",{cambios:{tema:b.dataset.t}}); }catch(e){} });
  $("#ajSkin").onchange = async e=>{ S.E.nichi_skin = e.target.value; aplicarSkin(); NI.anim("spin"); try{ await api("/api/ajustes",{cambios:{nichi_skin:e.target.value}}); toast("Nichi se cambió de disfraz"); }catch(e2){} };
  $("#ajDatos").onchange = e=>{ NI.silencio = !e.target.checked; localStorage.setItem("nf_mute", NI.silencio?"1":"0"); };
  $("#kyAdd").onclick = async ()=>{ const v=$("#kyNueva").value.trim(); if(!v) return;
    try{ await api("/api/claves_youtube/agregar",{clave:v}); toast("Clave agregada"); NI.anim("jump"); await cargarEstado(); renderAjustes(); }catch(e){ err(e); } };
  $("#kyProbar").onclick = async ()=>{ $("#kyRes").textContent="Probando…"; try{ const r=await api("/api/claves_youtube/probar",{});
    $("#kyRes").innerHTML = r.resultados.map(x=>`#${x.n} ${x.ok?"✅":"❌ "+esc(x.mensaje)}`).join(" · ") || "Sin claves"; renderAjustesClavesSoloLista(); }catch(e){ $("#kyRes").textContent=e.message; } };
};
async function quitarClaveYT(i){ if(!confirm("¿Quitar esta clave de YouTube?")) return; try{ await api("/api/claves_youtube/quitar",{indice:i}); await cargarEstado(); renderAjustes(); }catch(e){ err(e); } }
function renderAjustesClavesSoloLista(){ setTimeout(()=>{ if(S.page==="ajustes") renderAjustes(); }, 1500); }

/* ---------------- Nichi: más contexto y preguntas ---------------- */
const _contextoBot = contextoBot;
contextoBot = function(){
  const c = _contextoBot(), r = S.inv;
  c.mis_canales = ((S.E||{}).mis_canales||[]).map(x=>({canal:x.canal, suscriptores:x.suscriptores, visitas_mes:x.visitas_mes, ingreso_mes:x.ingreso_mes, activo:x.activo}));
  if (r) c.investigacion = {titulo:r.titulo, nichos:r.nichos.slice(0,12), videos_top:invVideos().slice(0,12).map(v=>({titulo:v.titulo, canal:v.canal, nicho:v.nicho, vistas:v.vistas, outlier:v.outlier, vph:v.vph})),
    canales_top:invCanales().slice(0,10).map(x=>({canal:x.canal, nicho:x.nicho, tipo:x.auto_tipo, visitas_mes:x.visitas_mes, edad_dias:x.edad_dias, ingreso_mes:x.ingreso_mes}))};
  if (S.SUG) c.sugerencias_actuales = S.SUG.sugerencias.map(s=>s.titulo);
  c.disfraz_nichi = SKINS[NI.skin];
  return c;
};
const _preguntasRotativas = preguntasRotativas;
preguntasRotativas = function(){
  if (S.inv && S.ACAD){
    const extra = ["¿Qué nicho de mi investigación replicarías?", "¿Cuál de estos canales automatizados es mejor referente?", "¿Qué video outlier copiarías primero?"];
    S.inv.nichos.slice(0,3).forEach(([n])=>{ if(n!=="Sin clasificar") extra.push(`¿Vale la pena el nicho «${n}»?`); });
    S.ACAD.preguntas = [...new Set([...extra, ...S.ACAD.preguntas])];
  }
  _preguntasRotativas();
};
const _datoAleatorio = datoAleatorio;
datoAleatorio = function(){
  const r = S.inv, op = [];
  if (r && r.videos.length){
    const v = r.videos[Math.floor(Math.random()*Math.min(15, r.videos.length))];
    op.push(`🔭 «${esc(v.titulo.slice(0,55))}» hizo <b>${textoOutlier(v.outlier)}</b> su canal · nicho <b>${esc(v.nicho)}</b>.`);
    const n = r.nichos.find(([x])=>x!=="Sin clasificar"); if (n) op.push(`🏷 El nicho más repetido en tu investigación es <b>${esc(n[0])}</b> (${n[1]} videos).`);
  }
  if (S.SUG && S.SUG.sugerencias.length){ const s = S.SUG.sugerencias[Math.floor(Math.random()*S.SUG.sugerencias.length)]; op.push(`💡 <b>${esc(s.titulo)}</b>: ${esc(s.detalle)}`); }
  return op.length && Math.random() < .5 ? op[Math.floor(Math.random()*op.length)] : _datoAleatorio();
};

/* ---------------- arranque v3 ---------------- */
(async()=>{
  await new Promise(r=>setTimeout(r, 300));
  if (S.E && S.E.tema && !localStorage.getItem("nf_tema")) aplicarTema(S.E.tema, true);
  aplicarSkin();
  if (skinDelMes() !== "ninja" && (!S.E || !S.E.nichi_skin || S.E.nichi_skin==="auto")) setTimeout(()=>{ NI.tag(SKINS[skinDelMes()]); emote((EMOTES[skinDelMes()]||["✨"])[0]); }, 1800);
})();
</script>

<script>
/* =====================================================================
   v4 — Patrones (títulos, miniaturas, etiquetas, SEO) y CPM por nicho
   ===================================================================== */
async function cargarPatrones(tipo, id, box, forzar){
  box.innerHTML = `<div class="card"><div class="row"><span class="dot on" style="display:inline-block"></span><b>Buscando patrones…</b></div>
    <div class="hint" style="margin:6px 0 12px">Comparo los videos que más superan a su canal contra el resto: títulos, miniaturas (descargo y analizo cada una), etiquetas y SEO.</div>
    <div class="shimmer" style="height:160px"></div></div>`;
  NI.mood("m-think", 0, "Buscando patrones…"); emote("🧬");
  try{
    const d = await api(`/api/patrones?tipo=${tipo}&id=${encodeURIComponent(id)}${forzar?"&forzar=1":""}`);
    S.PAT = d; renderPatrones(box, d, tipo, id); NI.mood("m-ok", 2000, "¡Patrones listos!"); accion("Vio los patrones de "+tipo);
  }catch(e){ box.innerHTML = `<div class="card empty"><div class="big">🧬</div>${esc(e.message)}</div>`; NI.mood("m-bad", 2500); }
}
function modalPatrones(tipo, id){
  $("#mbox").className = "mbox";
  $("#mbox").innerHTML = `<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0;font-size:20px">🧬 Patrones de esta búsqueda</h2><button class="x" onclick="cerrarModal()">✕</button></div><div id="patModal"></div>`;
  $("#modal").classList.remove("hidden");
  cargarPatrones(tipo, id, $("#patModal"));
}
function barraComp(a, b, max){ const w = v => Math.max(2, Math.round(100*v/(max||1)));
  return `<div style="display:flex;flex-direction:column;gap:3px;min-width:120px"><div class="prog" title="Videos top"><i style="width:${w(a)}%"></i></div><div class="prog" title="Resto"><i style="width:${w(b)}%;background:${GRIS}"></i></div></div>`; }
function renderPatrones(box, d, tipo, id){
  const t = d.titulos, s = d.seo, m = d.miniaturas, pre = "pt"+Math.random().toString(36).slice(2,6);
  const liftChip = l => l==null ? "" : `<span class="chip ${l>=1.15?"up":l<0.9?"down":""}">${l}x</span>`;
  box.innerHTML = `
  <div class="card"><div class="row"><h2 class="grow">💡 Lo que se repite en los ganadores</h2>
      <button class="btn sm" onclick="preguntar('Explícame los patrones que encontraste y qué debería copiar')">💬 Pregúntale a Nichi</button>
      <button class="btn sm" onclick="cargarPatrones('${tipo}','${id}', this.closest('.card').parentNode, true)">↻ Recalcular</button></div>
    <div class="sub" style="margin:4px 0 10px">${d.n} videos analizados · «x» = cuántas veces supera el video a la mediana de su canal.</div>
    ${(d.conclusiones||[]).map((c,i)=>`<div class="sug" style="animation-delay:${i*60}ms;cursor:default"><span class="ic">${["🎯","🧩","📏","🖼","🎨","🔎"][i%6]}</span><div>${esc(c)}</div></div>`).join("") || `<div class="hint">Aún no hay suficientes videos para sacar conclusiones fuertes.</div>`}</div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card"><h2>✍️ Rasgos de título que más rinden</h2><div class="sub">Rendimiento de los videos con ese rasgo frente a los que no lo tienen</div>
      <div class="chartbox" style="margin-top:10px;height:${Math.max(200, t.rasgos.length*30)}px"><canvas id="${pre}r"></canvas></div></div>
    <div class="card"><h2>🗂 Tipos de título</h2><div class="sub">Clasificación automática de cada título y su rendimiento</div>
      <div class="chartbox" style="margin-top:10px"><canvas id="${pre}t"></canvas></div>
      <div class="hint">Largo promedio: ${t.largo_prom} caracteres · en los ganadores: <b>${t.largo_top}</b></div></div></div>

  <div class="card" style="margin-top:18px"><h2>🧩 Fórmulas de título repetidas</h2><div class="sub">Inicios de título que se repiten (N = cualquier número). Si aparecen en varios canales, la fórmula está validada.</div>
    ${t.formulas.length ? `<div class="tw" style="margin-top:10px"><table class="t"><tr><th>Fórmula</th><th class="num">Videos</th><th class="num">Canales</th><th class="num">Outlier prom.</th><th>Ejemplo que más rindió</th></tr>
      ${t.formulas.map(f=>`<tr><td><b>«${esc(f.formula)}…»</b></td><td class="num">${f.n}</td><td class="num">${f.canales}</td><td class="num"><b>${f.outlier}x</b></td>
        <td style="white-space:normal;max-width:460px"><span class="small">${esc(f.ejemplos[0]||"")}</span> <button class="btn sm" onclick="copiar(${esc(JSON.stringify(f.ejemplos.join("\n")))})">⧉</button></td></tr>`).join("")}</table></div>`
      : `<div class="hint" style="margin-top:8px">No hay fórmulas repetidas (necesito al menos 3 títulos con el mismo inicio).</div>`}</div>

  <div class="card" style="margin-top:18px"><h2>💡 Ideas repetidas entre canales</h2><div class="sub">Videos con títulos casi iguales: la misma idea funcionando en varios canales = idea validada para replicar.</div>
    <div class="carr" style="margin-top:12px;grid-auto-columns:minmax(320px,360px)">${(d.ideas||[]).map((g,i)=>`<div class="ccard" style="animation-delay:${i*50}ms">
      <div class="row"><b class="grow" style="text-transform:capitalize">${esc(g.idea)}</b><span class="chip up">${g.outlier}x</span></div>
      <div class="hint">${g.n} videos · ${g.canales} canal(es)</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${g.videos.slice(0,3).map(v=>`<a href="${esc(v.url)}" target="_blank" title="${esc(v.titulo)} · ${esc(v.canal)}" style="position:relative;aspect-ratio:16/9;border-radius:8px;background:var(--soft2) url('${esc(v.miniatura)}') center/cover"><span class="sv" style="right:3px;top:3px">${btnV(v)}</span></a>`).join("")}</div>
      ${g.videos.slice(0,3).map(v=>`<div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">• ${esc(v.titulo)}</div>`).join("")}</div>`).join("") || `<span class="hint">No encontré títulos casi iguales en esta tanda.</span>`}</div></div>

  <div class="card" style="margin-top:18px"><h2>🖼 Miniaturas</h2>
    ${!m ? `<div class="hint">Sin análisis de miniaturas.</div>` : m.error ? `<div class="hint" style="margin-top:6px">${esc(m.error)}</div>` : `
    <div class="sub">${m.analizadas} miniaturas descargadas y analizadas · comparo el 25 % que más rinde contra el resto</div>
    <div class="grid g2" style="margin-top:12px">
      <div><div class="chartbox"><canvas id="${pre}m"></canvas></div></div>
      <div><h3>Colores que más usan los ganadores</h3><div class="row" style="gap:8px">${m.colores_top.map(c=>`<span title="${c}" style="width:38px;height:38px;border-radius:12px;background:${c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"></span>`).join("")}</div>
        <h3 style="margin-top:16px">Estilos y su rendimiento</h3>
        ${m.estilos.map(e=>`<div class="nbar" style="cursor:default"><b style="width:52%">${esc(e.estilo)}</b><span class="hint" style="width:70px">${e.pct} %</span><span class="chip ${e.outlier>=1.2?"up":""}">${e.outlier}x</span></div>`).join("")}</div></div>
    <h3 style="margin-top:18px">Ejemplos por estilo</h3>
    <div class="tgrid">${m.estilos.slice(0,4).flatMap(e=>e.ejemplos.slice(0,2).map(x=>`<a href="${esc(x.url)}" target="_blank" style="background-image:url('${esc(x.miniatura)}')"><span class="sv">${btnV(x)}</span><em class="ob" style="font-style:normal">${esc(e.estilo)}</em><span>${esc(x.titulo)}</span></a>`)).join("")}</div>
    ${m.parecidas.length ? `<h3 style="margin-top:18px">Miniaturas casi iguales (misma plantilla o diseño)</h3>
      <div class="carr" style="grid-auto-columns:minmax(300px,340px)">${m.parecidas.map(g=>`<div class="ccard"><div class="row"><b class="grow">${g.n} miniaturas · ${g.canales} canal(es)</b><span class="chip up">${g.outlier}x</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${g.videos.slice(0,6).map(v=>`<a href="${esc(v.url)}" target="_blank" title="${esc(v.titulo)}" style="position:relative;aspect-ratio:16/9;border-radius:8px;background:var(--soft2) url('${esc(v.miniatura)}') center/cover"><span class="sv" style="right:3px;top:3px">${btnV(v)}</span></a>`).join("")}</div></div>`).join("")}</div>` : ""}`}</div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card"><h2>🔎 SEO</h2><div class="sub">Etiquetas, descripción y coherencia con el título</div>
      <div class="row" style="margin:12px 0;gap:24px"><div><div style="font-size:30px;font-weight:800">${s.seo_prom}<span class="hint">/100</span></div><div class="hint">SEO promedio</div></div>
        <div><div style="font-size:30px;font-weight:800;color:var(--good)">${s.seo_top}<span class="hint">/100</span></div><div class="hint">SEO de los ganadores</div></div>
        <div><div style="font-size:30px;font-weight:800">${s.etiquetas_prom}</div><div class="hint">etiquetas por video</div></div></div>
      ${s.practicas.map(p=>`<div class="nbar" style="cursor:default"><span style="width:50%" class="small">${esc(p.practica)}</span><span class="hint" style="width:60px">${p.pct} %</span>
        ${barraComp(p.outlier_si, p.outlier_no, Math.max(p.outlier_si, p.outlier_no))}<span class="small" style="width:90px;text-align:right">${p.outlier_si}x vs ${p.outlier_no}x</span></div>`).join("")}
      ${s.con_descripcion ? "" : `<div class="hint" style="margin-top:8px">Estos videos no traen descripción guardada: haz una investigación nueva para medir el SEO completo.</div>`}</div>
    <div class="card"><h2>🏷 Etiquetas que más se repiten</h2><div class="sub">Número = videos que la usan · toca para copiar</div>
      <div class="tags" style="margin-top:12px">${s.etiquetas.map(e=>`<button class="tag" onclick="copiar(this.dataset.t)" data-t="${esc(e.tag)}" title="${e.outlier}x de outlier promedio">${esc(e.tag)}<small>${e.n}</small></button>`).join("") || `<span class="hint">Estos videos no usan etiquetas públicas.</span>`}</div>
      ${s.etiquetas.length?`<button class="btn sm" style="margin-top:12px" onclick="copiar(${esc(JSON.stringify(s.etiquetas.slice(0,20).map(e=>e.tag).join(", ")))})">⧉ Copiar las 20 principales</button>`:""}</div></div>`;
  const R = t.rasgos;
  chart(pre+"r", {type:"bar", data:{labels:R.map(r=>r.nombre), datasets:[
      {label:"Con el rasgo", data:R.map(r=>r.outlier_con), backgroundColor:VERDE},
      {label:"Sin el rasgo", data:R.map(r=>r.outlier_sin), backgroundColor:GRIS}]},
    options:{indexAxis:"y", plugins:{tooltip:{callbacks:{afterBody:i=>{ const r=R[i[0].dataIndex]; return [`${r.pct} % de los videos`, ...r.ejemplos.slice(0,2).map(x=>"• "+x.slice(0,70))]; }, label:i=>` ${i.dataset.label}: ${i.raw}x`}}},
      scales:{x:{grid:{color:GRID}, ticks:{callback:v=>v+"x"}}, y:{grid:{display:false}}}}});
  chart(pre+"t", {data:{labels:t.tipos.map(x=>x.tipo), datasets:[
      {type:"bar", label:"Outlier promedio", data:t.tipos.map(x=>x.outlier), backgroundColor:PALETA(), yAxisID:"y"},
      {type:"line", label:"% de videos", data:t.tipos.map(x=>x.pct), borderColor:AZUL, pointBackgroundColor:AZUL, pointRadius:4, yAxisID:"y1"}]},
    options:{scales:{x:{grid:{display:false}, ticks:{autoSkip:false, maxRotation:30, font:{size:10}}}, y:{grid:{color:GRID}, ticks:{callback:v=>v+"x"}}, y1:{position:"right", grid:{display:false}, ticks:{callback:v=>v+"%"}}}}});
  if (m && !m.error) chart(pre+"m", {type:"bar", data:{labels:m.metricas.map(x=>x.nombre), datasets:[
      {label:"Videos top", data:m.metricas.map(x=>x.top), backgroundColor:VERDE},
      {label:"Resto", data:m.metricas.map(x=>x.resto), backgroundColor:GRIS}]},
    options:{plugins:{tooltip:{callbacks:{afterLabel:i=>{ const x=m.metricas[i.dataIndex]; return x.dif!=null?`Diferencia: ${x.dif>0?"+":""}${x.dif} %`:""; }}}},
      scales:{x:{grid:{display:false}, ticks:{autoSkip:false, maxRotation:35, font:{size:10}}}, y:{grid:{color:GRID}}}}});
}

/* ---------------- Nichi conoce los patrones ---------------- */
const _contextoBot2 = contextoBot;
