    formulas:S.PAT.titulos.formulas.slice(0,6).map(f=>({formula:f.formula, videos:f.n, canales:f.canales, outlier:f.outlier, ejemplo:f.ejemplos[0]})),
    tipos_titulo:S.PAT.titulos.tipos, ideas_repetidas:(S.PAT.ideas||[]).slice(0,6).map(g=>({idea:g.idea, canales:g.canales, outlier:g.outlier})),
    miniaturas:S.PAT.miniaturas && !S.PAT.miniaturas.error ? {estilos:S.PAT.miniaturas.estilos.map(e=>({estilo:e.estilo, pct:e.pct, outlier:e.outlier})), metricas:S.PAT.miniaturas.metricas} : null,
    seo:{promedio:S.PAT.seo.seo_prom, ganadores:S.PAT.seo.seo_top, etiquetas_top:S.PAT.seo.etiquetas.slice(0,12).map(e=>e.tag)}};
  return c;
};

/* ---------------- Ajustes: CPM por nicho, audiencia y temporada ---------------- */
const _renderAjustes2 = renderAjustes;
renderAjustes = async function(){
  await _renderAjustes2();
  let d; try{ d = await api("/api/ajustes"); }catch(e){ return; }
  const a = d.ajustes, el = $("#p-ajustes");
  const h = [...el.querySelectorAll("h2")].find(x=>x.textContent.startsWith("CPM por categoría"));
  if (h) h.innerHTML = 'CPM por categoría <span class="hint">(se usa si no detecto el nicho del canal)</span>';
  el.insertAdjacentHTML("beforeend", `<div class="card" style="margin-top:18px"><div class="row"><h2 class="grow">💵 CPM por nicho y ajustes por canal</h2><button class="btn pri" id="cpmGuardar">Guardar</button></div>
    <div class="sub">El RPM de cada canal se calcula con: CPM de su <b>nicho</b> (o de su categoría) × su <b>país</b> o idioma × su <b>audiencia</b> × lo que <b>duran</b> sus videos × la <b>temporada</b>. La ficha de cada canal muestra el cálculo.</div>
    <div class="row" style="margin-top:12px;gap:18px">
      <label class="chk"><input type="checkbox" id="cpmTemp" ${a.temporada!==false?"checked":""}> Ajustar por temporada (sube en oct–dic, baja en ene–feb)</label>
      ${["mayores","general","jovenes"].map(k=>`<span class="fchip">Audiencia ${k==="jovenes"?"jóvenes":k} × <input type="number" step="0.05" data-aud="${k}" value="${(a.factor_audiencia||{})[k]??1}" style="width:70px"></span>`).join("")}</div>
    <input type="text" id="cpmFil" placeholder="Filtrar nichos…" style="margin-top:12px;max-width:320px">
    <div class="filters" id="cpmGrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:10px">
      ${Object.entries(a.cpm_nicho||{}).sort((x,y)=>y[1]-x[1]).map(([n,v])=>`<div data-n="${esc(n.toLowerCase())}"><label>${esc(n)}</label><input type="number" step="0.5" data-cpmn="${esc(n)}" value="${v}"></div>`).join("")}
    </div>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap;max-width:620px"><input type="text" id="cpmNuevoN" list="catList2" placeholder="Agregar nicho (ej: uno que aprendió la IA)"><input type="number" step="0.5" id="cpmNuevoV" placeholder="CPM $" style="max-width:110px"><button class="btn" id="cpmAdd">＋</button></div>
    <datalist id="catList2"></datalist></div>`);
  api("/api/categorias").then(r=>{ $("#catList2").innerHTML = r.categorias.filter(c=>!(a.cpm_nicho||{})[c]).map(c=>`<option value="${esc(c)}">`).join(""); }).catch(()=>{});
  $("#cpmFil").oninput = e=>{ const q=e.target.value.toLowerCase(); document.querySelectorAll("#cpmGrid>div").forEach(x=>x.style.display = x.dataset.n.includes(q)?"":"none"); };
  $("#cpmAdd").onclick = ()=>{ const n=$("#cpmNuevoN").value.trim(), v=$("#cpmNuevoV").value; if(!n||!v) return toast("Escribe el nicho y su CPM");
    $("#cpmGrid").insertAdjacentHTML("afterbegin", `<div data-n="${esc(n.toLowerCase())}"><label>${esc(n)}</label><input type="number" step="0.5" data-cpmn="${esc(n)}" value="${v}"></div>`); $("#cpmNuevoN").value=""; $("#cpmNuevoV").value=""; };
  $("#cpmGuardar").onclick = async ()=>{
    const cpm={}; document.querySelectorAll("[data-cpmn]").forEach(i=>{ if(i.value!=="") cpm[i.dataset.cpmn]=+i.value; });
    const aud={}; document.querySelectorAll("[data-aud]").forEach(i=>{ aud[i.dataset.aud]=+i.value||1; });
    try{ await api("/api/ajustes",{cambios:{cpm_nicho:cpm, factor_audiencia:aud, temporada:$("#cpmTemp").checked}}); toast("Guardado. Vacía la caché para recalcular los canales ya analizados."); NI.anim("jump"); emote("💵"); }catch(e){ err(e); } };
};
</script>

<script>
/* =====================================================================
   v5 — Guardar videos y canales desde cualquier parte (☆ / ★ sincronizados)
   ===================================================================== */
S.VG = S.VG || new Set(); S.CG = S.CG || new Set(); S.VREG = {};
function vidId(v){ return (v && (v.id || ((v.url||"").match(/[?&]v=([\w-]{6,})/)||[])[1])) || ""; }
function regV(v, extra){
  const id = vidId(v); if (!id) return "";
  S.VREG[id] = {...(S.VREG[id]||{}), ...v, ...(extra||{}), id};
  if (!S.VREG[id].url) S.VREG[id].url = `https://www.youtube.com/watch?v=${id}`;
  if (!S.VREG[id].miniatura) S.VREG[id].miniatura = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  return id;
}
function btnV(v, extra, texto){
  const id = regV(v, extra); if (!id) return "";
  const on = S.VG.has(id);
  return `<button class="btn sm gv ${on?"pri":""}" data-gv="${id}" ${texto?'data-txt="1"':""} title="${on?"Quitar de tus videos guardados":"Guardar este video"}"
    onclick="event.preventDefault();event.stopPropagation();toggleVideo('${id}')">${on?"★":"☆"}${texto?(on?" Guardado":" Guardar"):""}</button>`;
}
function btnC(cid, nicho, texto){
  if (!cid || cid==="undefined") return "";
  const on = S.CG.has(cid);
  return `<button class="btn sm gc ${on?"pri":""}" data-gc="${cid}" data-n="${esc(nicho||"")}" ${texto?'data-txt="1"':""} title="${on?"Quitar el canal del embudo":"Guardar el canal en el embudo"}"
    onclick="event.preventDefault();event.stopPropagation();toggleCanal('${cid}', this.dataset.n)">${on?"★":"☆"}${texto?(on?" Canal guardado":" Guardar canal"):" 👥"}</button>`;
}
function refrescarBotones(){
  document.querySelectorAll("[data-gv]").forEach(b=>{ const on = S.VG.has(b.dataset.gv); b.classList.toggle("pri", on);
    b.innerHTML = (on?"★":"☆") + (b.dataset.txt ? (on?" Guardado":" Guardar") : ""); b.title = on ? "Quitar de tus videos guardados" : "Guardar este video"; });
  document.querySelectorAll("[data-gc]").forEach(b=>{ const on = S.CG.has(b.dataset.gc); b.classList.toggle("pri", on);
    b.innerHTML = (on?"★":"☆") + (b.dataset.txt ? (on?" Canal guardado":" Guardar canal") : " 👥"); b.title = on ? "Quitar el canal del embudo" : "Guardar el canal en el embudo"; });
}
async function toggleVideo(id){
  const on = S.VG.has(id);
  const inv = (typeof buscarVideoInv==="function" && buscarVideoInv(id)) || null;
  const v = {...(S.VREG[id]||{id}), ...(inv||{})};
  try{
    if (on){ await api("/api/video/quitar", {id}); S.VG.delete(id); toast("Video quitado de tu biblioteca"); }
    else {
      await api("/api/video/guardar", {video:v, categoria:(v.nicho && v.nicho!=="Sin clasificar") ? v.nicho : ""});
      S.VG.add(id); toast("Video guardado ⭐ (Guardados → Videos)"); NI.anim("jump"); emote("⭐"); accion("Guardó el video «"+(v.titulo||id).slice(0,40)+"»");
    }
    if (inv) inv.guardado = !on;
    refrescarBotones();
    if (S.page==="guardados") renderGuardados();
  }catch(e){ err(e); }
}
async function toggleCanal(cid, nicho){
  const on = S.CG.has(cid);
  try{
    if (on){ await api("/api/guardado/quitar", {ids:[cid]}); S.CG.delete(cid); toast("Canal quitado del embudo"); }
    else { await api("/api/guardar", {ids:[cid], nicho:nicho||""}); S.CG.add(cid); toast("Canal guardado en el embudo 💾"); NI.anim("jump"); emote("💾"); accion("Guardó un canal en el embudo"); }
    [S.busq && S.busq.canales, S.inv && S.inv.canales].forEach(l=>(l||[]).forEach(c=>{ if (c.id===cid) c.guardado = !on; }));
    refrescarBotones();
    if (S.page==="guardados") renderGuardados();
  }catch(e){ err(e); }
}
// compatibilidad con los botones antiguos
guardarVideoInv = (id)=>toggleVideo(id);
guardarCanalInv = (id)=>toggleCanal(id, ((S.inv&&S.inv.canales.find(c=>c.id===id))||{}).nicho);
const _quitarVideo = quitarVideo;
quitarVideo = async function(id){ await _quitarVideo(id); await cargarEstado(); refrescarBotones(); };
const _quitarG = quitarG;
quitarG = async function(id){ await _quitarG(id); await cargarEstado(); refrescarBotones(); };
</script>

<script>
/* =====================================================================
   v6 — 📈 Seguimiento real de visitas
   ===================================================================== */
const ORIGEN = {mio:"📺 Mío", guardado:"★ Guardado", seguido:"👁 Seguido"};
function hace(iso){ if(!iso) return "nunca"; const m = Math.round((Date.now()-new Date(iso))/60000);
  return m<1 ? "hace un momento" : m<60 ? `hace ${m} min` : m<1440 ? `hace ${Math.round(m/60)} h` : `hace ${Math.round(m/1440)} días`; }
function spark(serie, color){
  const vs = (serie||[]).map(x=>x.v).filter(v=>v!=null); if (vs.length < 2) return `<span class="hint">—</span>`;
  const max = Math.max(...vs), min = Math.min(...vs, 0), W = 96, H = 26;
  const pts = vs.map((v,i)=>`${(i/(vs.length-1)*W).toFixed(1)},${(H-2-(v-min)/((max-min)||1)*(H-4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color||VERDE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function chipCrec(p){ return p==null ? `<span class="hint">—</span>` : `<span class="chip ${p>=10?"up":p<=-10?"down":""}">${p>0?"↗ +":p<0?"↘ ":""}${p}%</span>`; }
function celdaGan(w){ if (!w) return `<span class="hint">midiendo…</span>`;
  return `<b>${fmtN(w.ganadas)}</b>${w.proyectado?` <span class="hint" title="Proyectado: aún hay ${w.dias_medidos} días medidos">~</span>`:""}`; }

S.segSort = {k:"d7", asc:false}; S.segVista = "dia";
async function renderSeguimiento(){
  const el = $("#p-seguimiento");
  let d; try{ d = await api("/api/seguimiento"); }catch(e){ throw e; }
  S.SEG = d;
  const cs = d.canales, conDatos = cs.filter(c=>c.seguimiento && c.seguimiento.d1);
  const val = (c,k)=>{ const m=c.seguimiento||{}; return k==="d1"||k==="d7"||k==="d30" ? ((m[k]||{}).ganadas ?? -1) : k==="crec" ? (m.crecimiento ?? -999) : k==="subs" ? ((m.d7||{}).subs ?? -1) : k==="canal" ? c.canal : (c[k] ?? -1); };
  const k = S.segSort.k, sg = S.segSort.asc ? 1 : -1;
  const lista = [...cs].sort((a,b)=> typeof val(a,k)==="string" ? sg*String(val(a,k)).localeCompare(val(b,k)) : sg*(val(a,k)-val(b,k)));
  const suma = f => conDatos.reduce((t,c)=>t+(f(c)||0),0);
  const top7 = [...conDatos].sort((a,b)=>((b.seguimiento.d7||{}).ganadas||0)-((a.seguimiento.d7||{}).ganadas||0));
  const topCrec = [...conDatos].filter(c=>c.seguimiento.crecimiento!=null).sort((a,b)=>b.seguimiento.crecimiento-a.seguimiento.crecimiento)[0];
  const prox = d.ultima_foto ? Math.max(0, Math.round((new Date(d.ultima_foto).getTime() + d.intervalo_horas*3600000 - Date.now())/60000)) : 0;
  const th = (key, n, num=true) => `<th data-sk="${key}" class="${num?"num":""} ${S.segSort.k===key?"s"+(S.segSort.asc?" asc":""):""}">${n}</th>`;
  el.innerHTML = `<div class="card"><div class="row"><div class="grow"><h2 style="font-size:20px">📈 Seguimiento real de visitas</h2>
      <div class="sub">Cada ${d.intervalo_horas} h tomo una "foto" de las visitas, suscriptores y videos de tus canales, los guardados y los que sigues. Con la diferencia entre fotos mido lo que <b>de verdad</b> ganan, y esas cifras reemplazan a las estimadas en todo el programa.</div></div>
      <button class="btn pri" id="segFoto">📸 Tomar foto ahora</button></div>
    <div class="row" style="margin-top:12px;gap:8px"><span class="chip">${cs.length} canales seguidos</span><span class="chip">Última foto: ${hace(d.ultima_foto)}</span>
      <span class="chip">${d.ultima_foto ? (prox>0 ? `Próxima en ~${prox>=60?Math.round(prox/60)+" h":prox+" min"}` : "Próxima: en cuanto abras el panel") : "Aún sin fotos"}</span>
      <span class="chip" title="Se borran las fotos más viejas, según la política de la API de YouTube">Guardo ${d.dias_retencion} días</span><div class="grow"></div>
      <input type="text" id="segRef" placeholder="@canal o link para seguir" style="max-width:260px"><button class="btn" id="segAdd">👁 Seguir canal</button></div>
    ${conDatos.length < cs.length ? `<div class="sug" style="margin-top:12px;cursor:default"><span class="ic">⏳</span><div><b>Las cifras reales se van completando solas.</b>
      <div class="small muted">Desde la segunda foto (unas ${d.intervalo_horas} h) ves las últimas 24 h; a los 7 días, la semana completa; a los 30 días, el mes. Mientras tanto, las cifras con <b>~</b> son proyecciones de lo que llevo medido.</div></div></div>` : ""}</div>
  ${cs.length ? `
  <div class="grid g4" style="margin-top:18px">
    ${kpiMini("Visitas ganadas en 7 días", fmtN(suma(c=>(c.seguimiento.d7||{}).ganadas)), `entre ${conDatos.length} canales medidos`)}
    ${kpiMini("Suscriptores ganados en 7 días", fmtN(suma(c=>(c.seguimiento.d7||{}).subs)), "")}
    ${kpiMini("Más visitas esta semana", top7[0] ? esc(top7[0].canal) : "—", top7[0] ? `${fmtN(top7[0].seguimiento.d7.ganadas)} visitas` : "")}
    ${kpiMini("Crece más rápido", topCrec ? esc(topCrec.canal) : "—", topCrec ? `${topCrec.seguimiento.crecimiento>0?"+":""}${topCrec.seguimiento.crecimiento}% vs la semana anterior` : "necesito 14 días de datos", true)}
  </div>
  <div class="card" style="margin-top:18px"><div class="row"><h2 class="grow">Visitas reales</h2>
    <div class="seg" id="segVista"><button data-v="dia" class="${S.segVista==="dia"?"on":""}">Visitas por día</button><button data-v="total" class="${S.segVista==="total"?"on":""}">Visitas totales</button></div></div>
    <div class="chartbox lg" style="margin-top:12px"><canvas id="segChart"></canvas></div>
    <div class="hint">Los 6 canales que más visitas ganaron en 7 días. Toca un nombre de la leyenda para ocultarlo.</div></div>
  <div class="card" style="margin-top:18px"><div class="tw" style="max-height:70vh"><table class="t"><tr>${th("canal","Canal",false)}<th>Datos</th>${th("d1","Últimas 24 h")}${th("d7","7 días")}${th("d30","30 días")}
      ${th("crec","Crecimiento")}${th("subs","Subs 7 días")}${th("visitas_mes","Visitas/mes")}${th("ingreso_mes","Ganancia/mes")}<th>Tendencia</th><th></th></tr>
    ${lista.map(c=>{ const m=c.seguimiento||{}; return `<tr data-salud="${c.salud||""}" data-nm="${esc(c.canal)}">
      <td><div class="chn"><i style="background-image:url('${esc(c.avatar)}')"></i><div style="min-width:0"><b onclick="abrirCanal('${c.id}')">${esc(c.canal)}</b><span>${ORIGEN[c.origen]||""} · ${esc(c.nicho||c.categoria||"")}</span></div></div></td>
      <td><span class="hint">${m.fotos?`${m.dias} días · ${m.fotos} fotos`:"sin fotos"}</span></td>
      <td class="num">${celdaGan(m.d1)}</td><td class="num">${celdaGan(m.d7)}</td><td class="num">${celdaGan(m.d30)}</td>
      <td class="num">${chipCrec(m.crecimiento)}</td><td class="num">${m.d7&&m.d7.subs!=null?(m.d7.subs>=0?"+":"")+fmtN(m.d7.subs):"—"}</td>
      <td class="num">${fmtN(c.visitas_mes)} ${c.real?`<span class="chip up" style="padding:0 6px" title="${esc(c.metodo_mes)}">real</span>`:`<span class="chip" style="padding:0 6px" title="Aún estimado: ${esc(c.metodo_mes)}">est.</span>`}</td>
      <td class="num">${usd(c.ingreso_mes)}</td><td>${spark(m.serie)}</td>
      <td class="nowrap">${c.origen==="seguido"?`<button class="btn sm" onclick="dejarSeguir('${c.id}')" title="Dejar de seguir">✕</button>`:""}${btnC(c.id, c.nicho)}</td></tr>`; }).join("")}</table></div></div>`
  : `<div class="card empty" style="margin-top:18px"><div class="big">📈</div>Aún no sigues canales.<br>Conecta tus canales, guarda canales en el embudo (☆) o escribe arriba un @canal y pulsa <b>👁 Seguir canal</b>.</div>`}`;
  $("#segFoto").onclick = async ()=>{ const b=$("#segFoto"); b.disabled=true; b.textContent="Tomando foto…"; NI.mood("m-think",0,"📸 Clic…"); emote("📸");
    try{ const r = await api("/api/seguimiento/foto",{}); toast(r.mensaje); NI.mood("m-ok",2000); accion("Tomó una foto de seguimiento"); renderSeguimiento(); }catch(e){ err(e); b.disabled=false; b.textContent="📸 Tomar foto ahora"; } };
  const seguirRef = async ()=>{ const ref=$("#segRef").value.trim(); if(!ref) return toast("Escribe el @canal o el link");
    $("#segAdd").disabled=true; $("#segAdd").textContent="Buscando…";
    try{ await api("/api/seguimiento/seguir",{ref}); toast("Siguiendo el canal 👁"); NI.anim("jump"); emote("👁"); accion("Empezó a seguir "+ref); renderSeguimiento(); }catch(e){ err(e); $("#segAdd").disabled=false; $("#segAdd").textContent="👁 Seguir canal"; } };
  $("#segAdd").onclick = seguirRef; $("#segRef").onkeydown = e=>{ if(e.key==="Enter") seguirRef(); };
  el.querySelectorAll("th[data-sk]").forEach(h=>h.onclick=()=>{ const key=h.dataset.sk; S.segSort={k:key, asc:S.segSort.k===key?!S.segSort.asc:key==="canal"}; renderSeguimiento(); });
  document.querySelectorAll("#segVista button").forEach(b=>b.onclick=()=>{ S.segVista=b.dataset.v; renderSeguimiento(); });
  if (cs.length){
    const top = top7.slice(0,6), pal = PALETA();
    const etiquetas = [...new Set(top.flatMap(c=>c.seguimiento.serie.map(x=>x.t)))].sort();
    chart("segChart", {type:"line", data:{labels:etiquetas.map(t=>new Date(t).toLocaleString("es",{day:"numeric",month:"short",hour:"2-digit"})),
      datasets:top.map((c,i)=>{ const mapa = Object.fromEntries(c.seguimiento.serie.map(x=>[x.t, S.segVista==="dia"?x.v:x.total]));
        return {label:c.canal, data:etiquetas.map(t=>mapa[t]??null), borderColor:pal[i%pal.length], backgroundColor:pal[i%pal.length], spanGaps:true, pointRadius:2}; })},
      options:{interaction:{mode:"index", intersect:false}, plugins:{tooltip:{callbacks:{label:i=>` ${i.dataset.label}: ${fmtF(i.raw)}${S.segVista==="dia"?" visitas/día":""}`}}}, scales:ejes()}});
  }
}
async function dejarSeguir(id){ try{ await api("/api/seguimiento/dejar",{id}); toast("Ya no lo sigo"); renderSeguimiento(); }catch(e){ err(e); } }
async function seguirCanal(id){ try{ await api("/api/seguimiento/seguir",{id}); toast("Siguiendo el canal 👁: tomo una foto cada 6 h"); NI.anim("jump"); emote("👁"); abrirCanal(id); }catch(e){ err(e); } }

/* ---- tarjeta de seguimiento en la ficha de cada canal ---- */
const _canalCompleto = canalCompleto;
canalCompleto = function(a, pre){
  let html = _canalCompleto(a, pre);
  const m = a.seguimiento;

<script>
/* =====================================================================
   v7 — Nichi experto: formato rico, acciones, memoria y modos rápidos
   ===================================================================== */
function inline(t){
  return t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<b>$1</b>")
    .replace(/(^|[\s(«"¿¡])\*([^*\n]+?)\*(?=[\s.,;:!?)»"]|$)/g, "$1<i>$2</i>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
}
const ICONO_ACC = {buscar:"🔎", investigar:"🔭", canal:"📊", guardar:"☆", seguir:"👁", ir:"➜"};
const NOMBRE_IR = {inicio:"Inicio", micanal:"Mis canales", seguimiento:"Seguimiento", investigacion:"Investigación", explorar:"Explorar",
  guardados:"Guardados", academia:"Aprende a Monetizar", ajustes:"Ajustes", virales:"Videos virales", graficos:"Gráficos", historial:"Historial"};
function mdBloques(texto){
  const lineas = esc(texto||"").replace(/\r/g,"").split("\n");
  let html = "", lista = null, parr = [];
  const cerrarP = ()=>{ if (parr.length){ html += `<p>${inline(parr.join("<br>"))}</p>`; parr = []; } };
  const cerrarL = ()=>{ if (lista){ html += `</${lista}>`; lista = null; } };
  for (const l of lineas){
    let m;
    if (!l.trim()){ cerrarP(); cerrarL(); continue; }
    if ((m = l.match(/^\s*#{1,6}\s*(.+)$/))){ cerrarP(); cerrarL(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ cerrarP(); cerrarL(); html += "<hr>"; continue; }
    if ((m = l.match(/^\s*&gt;\s?(.*)$/))){ cerrarP(); cerrarL(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.+)$/))){ cerrarP(); if (lista!=="ul"){ cerrarL(); html += "<ul>"; lista="ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.+)$/))){ cerrarP(); if (lista!=="ol"){ cerrarL(); html += `<ol start="${m[1]}">`; lista="ol"; } html += `<li>${inline(m[2])}</li>`; continue; }
    cerrarL(); parr.push(l.trim());
  }
  cerrarP(); cerrarL();
  return html;
}
function mdNichi(texto, canales){
  // 1) separa el razonamiento ("Cómo lo decidí") para mostrarlo plegado
  let principal = texto || "", razon = "";
  const mr = principal.match(/^[ \t]*#{1,6}[ \t]*(🧠[ \t]*)?(cómo lo decidí|como lo decidi|razonamiento|cómo lo pensé)[ \t]*:?[ \t]*$/im);
  if (mr){ razon = principal.slice(mr.index + mr[0].length); principal = principal.slice(0, mr.index); }
  // 2) acciones [[tipo:valor]] -> botones
  const acciones = [];
  principal = principal.replace(/\[\[\s*(buscar|investigar|canal|guardar|seguir|ir)\s*:\s*([^\]]+?)\s*\]\]/gi, (_, t, v)=>{ acciones.push([t.toLowerCase(), v.trim()]); return ""; });
  let html = mdBloques(principal.trim());
  if (acciones.length){
    html += `<div class="acciones">${acciones.slice(0,4).map(([t,v])=>`<button class="btn sm ${t==="investigar"||t==="buscar"?"pri":""}" data-acc="${t}" data-val="${esc(v)}">${ICONO_ACC[t]} ${
      t==="ir" ? "Ir a "+esc(NOMBRE_IR[v]||v) : t==="buscar" ? "Buscar «"+esc(v)+"»" : t==="investigar" ? "Investigar «"+esc(v)+"»" : t==="canal" ? "Ver "+esc(v) : t==="guardar" ? "Guardar "+esc(v) : "Seguir "+esc(v)}</button>`).join("")}</div>`;
  }
  if (razon.trim()) html += `<details><summary>🧠 Cómo lo decidí</summary>${mdBloques(razon.trim())}</details>`;
  return html;
}
function idDeCanal(nombre){
  const n = (nombre||"").toLowerCase().trim();
  const fuentes = [...(S.ultCanales||[]), ...(((S.busq||{}).canales)||[]), ...(((S.inv||{}).canales)||[]), ...(((S.SEG||{}).canales)||[]), ...(((S.E||{}).top_referentes)||[])];
  const c = fuentes.find(x=>(x.canal||"").toLowerCase()===n) || fuentes.find(x=>(x.canal||"").toLowerCase().includes(n) && n.length>3);
  return c ? c.id : null;
}
async function ejecutarAccion(t, v){
  accion(`Nichi: ${t} ${v}`);
  if (t==="ir"){ ir(NOMBRE_IR[v] ? v : "inicio"); return; }
  if (t==="buscar"){ ir("explorar"); setTimeout(()=>{ $("#exQ").value = v; agregarFrase(); toast("Frase agregada: pulsa 🔎 Buscar o agrega más"); }, 200); return; }
  if (t==="investigar"){ S.invQ = v; ir("investigacion"); setTimeout(()=>{ const q=$("#invQ"); if(q){ q.value=v; $("#invGo").click(); } }, 500); return; }
  const id = idDeCanal(v);
  if (!id){ toast(`No encontré «${v}» entre los canales analizados`); return; }
  if (t==="canal") abrirCanal(id);
  else if (t==="guardar"){ if (!S.CG.has(id)) toggleCanal(id, ""); else toast("Ese canal ya está guardado ★"); }
  else if (t==="seguir"){ try{ await api("/api/seguimiento/seguir",{id}); toast("Siguiendo el canal 👁"); emote("👁"); }catch(e){ err(e); } }
}
document.addEventListener("click", e=>{ const b = e.target.closest("[data-acc]"); if (b){ e.preventDefault(); ejecutarAccion(b.dataset.acc, b.dataset.val); } });

/* ---- memoria de la conversación ---- */
S.chatHist = JSON.parse(localStorage.getItem("nf_hist") || "[]");
function guardarHist(){ S.chatHist = S.chatHist.slice(-30); localStorage.setItem("nf_hist", JSON.stringify(S.chatHist)); }

/* ---- pregunta con pasos de razonamiento visibles ---- */
const PASOS = ["Revisando tus datos…", "Comparando nichos y canales…", "Aplicando Aprende a Monetizar…", "Eligiendo la mejor opción…", "Armando tu plan…"];
preguntar = async function(q){
  if (!q || !q.trim()) return;
  if ($("#chat").classList.contains("hidden")) await abrirChat(true);
  $("#bubble").classList.add("hidden");
  accion("Preguntó a Nichi: "+q.slice(0,60));
  msg(esc(q), "u");
  const d = msg(`<div class="pensando"><i></i><i></i><i></i><span>${PASOS[0]}</span></div>`, "b");
  let k = 0; const reloj = setInterval(()=>{ k = Math.min(PASOS.length-1, k+1); const s = d.querySelector(".pensando span"); if (s) s.textContent = PASOS[k]; }, 1800);
  NI.mood("m-think", 0, "Pensando…");
  try{
    const r = await api("/api/bot", {pregunta:q, contexto:contextoBot(), historial:S.chatHist.slice(-8)});
    S.ultCanales = r.canales || S.ultCanales;
    d.innerHTML = mdNichi(r.texto, r.canales) + (r.proveedor ? `<div class="hint" style="margin-top:6px;font-size:10.5px">vía ${esc(r.proveedor)}</div>` : (r.ia===false ? `<div class="hint" style="margin-top:6px;font-size:10.5px">modo experto sin IA</div>` : ""));
    S.chatHist.push({role:"user", content:q}, {role:"assistant", content:r.texto}); guardarHist();
    NI.mood("m-ok", 1800); NI.anim("wiggle");
  }catch(e){ d.textContent = "No pude responder: "+e.message; NI.mood("m-bad", 3000); }
  clearInterval(reloj);
  $("#msgs").scrollTop = 1e9; preguntasRotativas();

/* ---- modos rápidos y restaurar la conversación al abrir ---- */
const MODOS = [["🎯 Elige mi nicho","Con todos mis datos, ¿qué nicho me conviene elegir? Compara las mejores opciones y elige una."],
  ["🏆 ¿Qué canal replico?","¿Qué canal debería replicar primero y por qué? Dame el plan para copiar lo que funciona."],
  ["🧭 Plan de 30 días","Según mi fase y mis datos, arma mi plan de los próximos 30 días, semana por semana."],
  ["💵 Sube mi RPM","¿Cómo subo el RPM y las ganancias de mis canales con lo que ves en mis datos?"],
  ["📈 ¿Quién crece?","Con el seguimiento real, ¿qué canales están creciendo de verdad y qué aprendo de ellos?"],
  ["🧬 Patrones","Explícame los patrones de títulos y miniaturas que encontraste y qué debería copiar."]];
const _abrirChatV7 = abrirChat;
abrirChat = async function(forzar){
  const c = $("#chat"), estabaOculto = c.classList.contains("hidden");
  if (estabaOculto && !$("#msgs").children.length && S.chatHist.length){
    S.chatHist.slice(-12).forEach(m=>{ const el = msg(m.role==="user" ? esc(m.content) : mdNichi(m.content), m.role==="user" ? "u" : "b"); });
  }
  await _abrirChatV7(forzar);
  if (!c.classList.contains("hidden") && !$("#modos")){
    $("#sugs").insertAdjacentHTML("beforebegin", `<div class="modos" id="modos">${MODOS.map(([n,q])=>`<button data-q="${esc(q)}">${n}</button>`).join("")}<button id="nuevaCharla" title="Borrar la conversación">🧹 Nueva charla</button></div>`);

<script>
/* 🎨 "Parecidas" en CUALQUIER miniatura del programa */
(function(){
  const b = document.createElement("button");
  b.id = "simBtn"; b.className = "btn sm pri"; b.textContent = "🎨 Parecidas"; b.title = "Buscar miniaturas parecidas a esta";
  b.style.cssText = "position:fixed;z-index:95;display:none;padding:5px 10px;font-size:11.5px;box-shadow:0 6px 18px rgba(0,0,0,.3)";
  document.body.appendChild(b);
  let actual = null, ocultar = null;
  const idDe = el => {
    const fuente = el.tagName === "IMG" ? el.src : (el.style && el.style.backgroundImage) || "";
    const m = fuente.match(/i\.ytimg\.com\/vi\/([\w-]{6,})\//); return m ? m[1] : null;
  };
  let pend = false, ultimo = null;
  const revisar = ()=>{
    pend = false;
    const e = ultimo; if (!e) return;
    if (e.target === b){ clearTimeout(ocultar); return; }
    let el = e.target, id = null;
    for (let k = 0; el && el !== document.body && k < 4; k++, el = el.parentElement){ id = idDe(el); if (id) break; }
    if (!id) return;
    const r = el.getBoundingClientRect();
    if (r.width < 70) return;                              // ignora miniaturas diminutas
    clearTimeout(ocultar); actual = id;
    b.style.left = (r.left + 6) + "px"; b.style.top = (r.bottom - 32) + "px"; b.style.display = "block";
  };
  document.addEventListener("mousemove", e=>{ ultimo = e; if (!pend){ pend = true; requestAnimationFrame(revisar); } }, {passive:true});
  document.addEventListener("mouseout", e=>{ ocultar = setTimeout(()=>{ b.style.display = "none"; }, 350); });
  b.addEventListener("click", e=>{ e.preventDefault(); e.stopPropagation(); b.style.display = "none"; if (actual) verParecidas(actual); });
  addEventListener("scroll", ()=>{ b.style.display = "none"; }, {passive:true, capture:true});
})();
</script>

<script>

const MONET = {si:["💰","up"], no:["🚫","down"], probable:["💰?","warn"], aun_no:["⏳","warn"], desconocido:["❔",""]};
function chipMonet(m, corto){
  if (!m || !m.veredicto) return "";
  const [ic, cl] = MONET[m.veredicto] || ["❔",""];
  const seguro = m.confianza === "confirmado" ? " ✓" : "";
  return `<span class="chip ${cl}" title="${esc(m.titulo)}: ${esc(m.motivo||"")}" style="white-space:nowrap">${ic}${corto?"":" "+esc(m.titulo)}${corto?seguro:""}</span>`;
}
function bloqueMonet(a){
  const m = a.monetizado || {};
  const ico = {bien:"✓", mal:"✕", neutral:"·"}, col = {bien:"var(--good)", mal:"#e5534b", neutral:"var(--muted)"};
  return `<div class="card" style="margin-top:18px" id="monetBox-${a.id}"><div class="row"><h2 class="grow">💰 ¿Está monetizado?</h2>
      <span class="chip ${m.confianza==="confirmado"?"up":""}">${m.confianza==="confirmado"?"100 % seguro":"confianza "+esc(m.confianza||"—")}</span></div>
    <div class="row" style="margin-top:10px;gap:10px">${chipMonet(m)}<span class="small">${esc(m.motivo||"")}</span></div>
    <div style="margin-top:10px">${(m.senales||[]).map(([t,txt])=>`<div class="small" style="display:flex;gap:8px;padding:3px 0"><b style="color:${col[t]};width:12px">${ico[t]}</b><span>${esc(txt)}</span></div>`).join("")}</div>
    <div class="row" style="margin-top:10px;gap:6px">
      ${m.pagina_leida ? `<span class="hint grow">Revisé su página pública ${hace(m.fecha)}.</span>` :
        `<span class="hint grow">Para confirmarlo al 100 % miro su página pública (botón «Unirse» o «Super Thanks», que solo tienen los canales del Programa de Socios).</span>
         <button class="btn sm pri" onclick="verificarMonet('${a.id}', true)">💰 Confirmar en su página</button>`}
      <button class="btn sm" onclick="verificarMonet('${a.id}', ${m.pagina_leida?"true":"false"}, true)">↻ Volver a verificar</button></div>
    <div class="hint" style="margin-top:8px">Solo el dueño del canal ve en YouTube Studio si está en el Programa de Socios. Por eso digo «confirmado» únicamente cuando hay una prueba segura; en los demás casos te doy la probabilidad y sus motivos.</div></div>`;
}

  try{
    const r = await api("/api/monetizado", {id, forzar:true, leer_pagina:!!leerPagina});

    if (leerPagina && !r.pagina_leida) toast("No pude leer su página pública (¿sin internet?). Muestro la estimación.");

}

  if (m) chart("mapaCmp", {type:"bar", data:{labels:["Tu canal","Referentes (inglés)","Competencia directa","Competencia indirecta"],
      datasets:[{data:[m.comparativa.yo, m.comparativa.referentes, m.comparativa.directa, m.comparativa.indirecta], backgroundColor:[AZUL, VERDE, "#e5534b", AMBAR]}]},
    options:{indexAxis:"y", plugins:{legend:{display:false}, tooltip:{callbacks:{label:i=>` ${fmtF(i.raw)} visitas/mes (mediana)`}}}, scales:{x:{grid:{color:GRID}, ticks:{callback:v=>fmtN(v)}}, y:{grid:{display:false}}}}});
}

/* ---------- 🚀 Outliers de referentes (pestaña en Videos virales) ---------- */
S.virTab = "busqueda"; S.orf = {dias:"90", omin:"2", nicho:"", idioma:""};
const _renderViralesV12 = renderVirales;
renderVirales = async function(){
  const el = $("#p-virales");
  const tabs = `<div class="itabs" style="margin-top:0">${[["busqueda","🔎 De tu búsqueda"],["referentes","🚀 De tus referentes"]].map(([k,n])=>`<button data-vt="${k}" class="${S.virTab===k?"on":""}">${n}</button>`).join("")}</div>`;
  if (S.virTab === "busqueda"){ await _renderViralesV12(); el.insertAdjacentHTML("afterbegin", tabs); }
  else {
    let d; try{ d = await api(`/api/outliers_referentes?dias=${S.orf.dias}&omin=${S.orf.omin}&nicho=${encodeURIComponent(S.orf.nicho)}&idioma=${S.orf.idioma}`); }catch(e){ throw e; }
    S.ORF = d;
    el.innerHTML = tabs + `<div class="card"><div class="row"><div class="grow"><h2 style="font-size:20px">🚀 Outliers de tus referentes</h2>
        <div class="sub">Los videos que más superan a su propio canal entre tus ${d.canales} referentes (guardados, seguidos, los que cumplen como referentes y los de tu mapa). Son ideas <b>ya validadas</b> para adaptar.</div></div>
        <button class="btn pri" id="orfAct" title="Lee los videos más recientes de tus referentes (~3 unidades por canal)">↻ Actualizar referentes</button></div>
      <div class="fchips" style="margin-top:12px">
        <span class="fchip">Publicados <select data-o="dias">${[["7","7 días"],["30","30 días"],["90","90 días"],["365","1 año"]].map(([k,n])=>`<option value="${k}" ${S.orf.dias===k?"selected":""}>${n}</option>`).join("")}</select></span>
        <span class="fchip">Outlier <select data-o="omin">${[["2","2x+"],["3","3x+"],["5","5x+"],["10","10x+"]].map(([k,n])=>`<option value="${k}" ${S.orf.omin===k?"selected":""}>${n}</option>`).join("")}</select></span>
        <span class="fchip">Idioma <select data-o="idioma">${[["","Todos"],["en","Inglés"],["es","Español"]].map(([k,n])=>`<option value="${k}" ${S.orf.idioma===k?"selected":""}>${n}</option>`).join("")}</select></span>
        <span class="fchip">🏷 Nicho <select data-o="nicho"><option value="">Todos</option>${d.nichos.map(([n,c])=>`<option value="${esc(n)}" ${S.orf.nicho===n?"selected":""}>${esc(n)} (${c})</option>`).join("")}</select></span>
        <span class="chip">${d.videos.length} videos</span></div></div>
      ${d.videos.length ? `<div class="vgrid" style="margin-top:18px">${d.videos.map((v,i)=>cardVideo(v,i).replace(`<div class="ac">`, `<div class="ac"><button class="btn sm" title="¿Por qué funcionó?" onclick="porQueFunciono('${v.id}')">💬</button>`)).join("")}</div>`
        : `<div class="card empty" style="margin-top:18px"><div class="big">🚀</div>No hay outliers con estos filtros.<br><span class="hint">Guarda o sigue referentes (o genera tu 🎯 mapa) y pulsa <b>Actualizar referentes</b>.</span></div>`}`;
    el.querySelectorAll("[data-o]").forEach(s=>s.onchange=()=>{ S.orf[s.dataset.o] = s.value; renderVirales(); });
    $("#orfAct").onclick = async ()=>{ try{ await api("/api/referentes/actualizar",{}); S.verJob=true; sondeo(); NI.mood("m-think",0,"🚀 Actualizando…"); }catch(e){ err(e); } };
  }
  el.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{ S.virTab = b.dataset.vt; renderVirales(); });
};
function porQueFunciono(id){
  const v = (S.ORF && S.ORF.videos.find(x=>x.id===id)) || {}; regV(v);
  preguntar(`¿Por qué funcionó este video y cómo lo adapto al español sin copiarlo? «${v.titulo}» del canal ${v.canal}: ${fmtF(v.vistas)} visitas, ${v.outlier}x la mediana de su canal, nicho ${v.nicho}. Analiza el título, el gancho probable y la miniatura, y dame 3 títulos en español.`);
}
const _buscarVideoInvV12 = buscarVideoInv;
buscarVideoInv = function(id){ return _buscarVideoInvV12(id) || (S.ORF && S.ORF.videos.find(v=>v.id===id)) || null; };

/* ---------- 💵 Nichos con RPM más alto (vista en Oportunidad) ---------- */
S.opVista = "indice";
const _renderOportunidadV12 = renderOportunidad;
renderOportunidad = async function(){
  const el = $("#p-oportunidad");
  const sel = `<div class="itabs" style="margin-top:0">${[["indice","🏆 Índice de oportunidad"],["rpm","💵 Nichos con RPM más alto"]].map(([k,n])=>`<button data-ov="${k}" class="${S.opVista===k?"on":""}">${n}</button>`).join("")}</div>`;
  if (S.opVista === "indice"){ await _renderOportunidadV12(); el.insertAdjacentHTML("afterbegin", sel); }
  else {
    let d; try{ d = await api("/api/rpm_nichos"); }catch(e){ throw e; }
    const N = d.nichos, max = Math.max(...N.map(n=>n.rpm_alto), 1);
    el.innerHTML = sel + `<div class="card"><h2 style="font-size:20px">💵 Nichos con RPM más alto</h2>
      <div class="sub">Lo que gana el creador por cada 1.000 visitas en cada nicho. Si ya analicé canales del nicho uso <b>su RPM real calculado</b> (país, audiencia, duración); si no, la tabla de CPM con un canal típico de EE. UU.</div>
      <div class="chartbox lg" style="margin-top:12px;height:${Math.max(320, Math.min(N.length, 16)*28)}px"><canvas id="rpmChart"></canvas></div></div>
    <div class="card" style="margin-top:18px"><div class="tw"><table class="t"><tr><th>#</th><th>Nicho</th><th class="num">RPM</th><th>Rango</th><th class="num">Por 1 M visitas</th><th class="num">CPM</th><th class="num">Ganancia/mes típica</th><th>Ejemplos</th><th>Dato</th></tr>
      ${N.map((n,i)=>`<tr><td><b>${i+1}</b></td><td style="white-space:normal;min-width:170px">${chipNicho(n.nicho,"","nicho","")}</td><td class="num"><b>$${n.rpm}</b></td>
        <td><div class="prog" style="width:110px;height:7px;position:relative"><i style="margin-left:${100*n.rpm_bajo/max}%;width:${Math.max(3,100*(n.rpm_alto-n.rpm_bajo)/max)}%"></i></div><span class="hint">$${n.rpm_bajo}–$${n.rpm_alto}</span></td>
        <td class="num">${usd(n.por_millon)}</td><td class="num">$${n.cpm}</td><td class="num">${n.ingreso_mes_prom?usd(n.ingreso_mes_prom):"—"}</td>
        <td style="white-space:normal">${n.ejemplos.map(c=>`<a href="#" onclick="event.preventDefault();abrirCanal('${c.id}')" class="small">${esc(c.canal)}</a>`).join(", ") || `<span class="hint">—</span>`}</td>
        <td><span class="chip ${n.fuente==="canales reales"?"up":""}">${esc(n.fuente)}</span></td></tr>`).join("")}</table></div></div>
    ${tip2("Para subir tu RPM dentro de un nicho: videos de 8+ minutos (más anuncios en medio), audiencia de EE. UU./Canadá/Europa, público adulto y publicar fuerte en octubre-diciembre, cuando los anunciantes pagan más.")}`;
    const top = N.slice(0, 16);
    chart("rpmChart", {type:"bar", data:{labels:top.map(n=>n.nicho.length>28?n.nicho.slice(0,27)+"…":n.nicho), datasets:[{data:top.map(n=>n.rpm), backgroundColor:top.map(n=>n.fuente==="canales reales"?VERDE:GRIS)}]},
      options:{indexAxis:"y", plugins:{legend:{display:false}, tooltip:{callbacks:{label:i=>` RPM $${top[i.dataIndex].rpm} · ${usd(top[i.dataIndex].por_millon)} por millón · ${top[i.dataIndex].fuente}`}}},
        scales:{x:{grid:{color:GRID}, ticks:{callback:v=>"$"+v}}, y:{grid:{display:false}}},
        onClick:(e,els)=>{ if (els[0]) buscarNicho(top[els[0].index].nicho); }}});
  }
  el.querySelectorAll("[data-ov]").forEach(b=>b.onclick=()=>{ S.opVista = b.dataset.ov; renderOportunidad(); });
};
function tip2(t){ return `<div class="sug" style="margin-top:18px;cursor:default"><span class="ic">💡</span><div class="small">${t}</div></div>`; }

/* ---------- Mis canales: acceso al mapa · Nichi conoce el mapa ---------- */
const _renderMiCanalV12 = renderMiCanal;
renderMiCanal = async function(){
  await _renderMiCanalV12();
  const cab = document.querySelector("#p-micanal .card .row");
  if (cab && !document.getElementById("mcMapa")) cab.insertAdjacentHTML("beforeend", `<button class="btn pri" id="mcMapa" onclick="ir('mapa')">🎯 Ver mi mapa: referentes y competencia</button>`);
};
const _contextoBotV12 = contextoBot;
contextoBot = function(){
  const c = _contextoBotV12();
  if (S.MAPA){ const r = x=>({canal:x.canal, nicho:x.nicho, visitas_mes:x.visitas_mes, edad_dias:x.edad_dias, por_que:x.por_que, monetizado:(x.monetizado||{}).titulo});
    c.mapa_de_mi_canal = {yo:{canal:S.MAPA.yo.canal, nicho:S.MAPA.yo.nicho, visitas_mes:S.MAPA.yo.visitas_mes}, referentes_ingles:S.MAPA.referentes.slice(0,8).map(r),
      competencia_directa:S.MAPA.directa.slice(0,8).map(r), competencia_indirecta:S.MAPA.indirecta.slice(0,6).map(r),
      temas_que_funcionan_en_ingles:S.MAPA.huecos_en, temas_de_la_competencia:S.MAPA.huecos_es, comparativa:S.MAPA.comparativa}; }
  if (S.ORF) c.outliers_de_referentes = S.ORF.videos.slice(0,10).map(v=>({titulo:v.titulo, canal:v.canal, outlier:v.outlier, visitas:v.vistas, nicho:v.nicho}));
  return c;
};
setTimeout(()=>api("/api/mapa").then(d=>{ S.MAPA = d.mapa; }).catch(()=>{}), 4500);
</script>
